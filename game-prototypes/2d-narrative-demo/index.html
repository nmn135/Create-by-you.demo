<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>封印之殿 · 第七天 · 像素叙事 Demo v2</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#000; overflow:hidden; font-family: 'Courier New', monospace; color:#d8d8d8; }
  #wrap { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    image-rendering: pixelated;
    background:#0a0a12;
    border:1px solid #222;
  }
  /* HUD */
  #hud {
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    pointer-events:none; font-size:12px; letter-spacing:1px; z-index:5;
    background:rgba(0,0,0,.6); padding:6px 14px; border:1px solid #444;
    text-shadow:1px 1px 0 #000; text-align:center;
  }
  #hud b { color:#ffd78c; }
  #hud-npcs { margin-top:4px; font-size:11px; color:#aaa; }
  #hud-npcs span { margin:0 6px; }
  #hud-npcs .r { color:#8fd0ff; }
  #hud-rep { margin-top:4px; font-size:11px; color:#aaa; }
  #hud-rep-val.pos { color:#8fd0ff; }
  #hud-rep-val.neg { color:#ff8c8c; }
  /* 底部操作提示 */
  #banner {
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#999; pointer-events:none; z-index:4;
    text-shadow:1px 1px 0 #000;
  }
  /* 对话面板 */
  #dialogue {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:min(94vw, 880px); background:rgba(10,10,18,.92);
    border:2px solid #6a6a6a; border-bottom:none; padding:10px 14px;
    z-index:10; display:none;
  }
  #dialogue.open { display:block; }
  #dlg-head { display:flex; align-items:center; gap:10px; border-bottom:1px solid #333; padding-bottom:6px; }
  #dlg-avatar { width:48px; height:48px; border:1px solid #888; image-rendering:pixelated; }
  #dlg-name { font-size:16px; color:#ffd78c; font-weight:bold; }
  #dlg-close { margin-left:auto; font-size:11px; color:#777; }
  #dlg-log { height:76px; overflow-y:auto; font-size:12px; color:#aaa; margin:6px 0; }
  /* 骑砍式话题快捷栏 */
  #dlg-topics { display:flex; gap:6px; margin:6px 0 2px; flex-wrap:wrap; }
  .topic-btn {
    background:#1a1a28; color:#ffd78c; border:1px solid #555;
    padding:3px 10px; font-size:12px; cursor:pointer; font-family:'Courier New',monospace;
  }
  .topic-btn:hover { background:#2e2e42; border-color:#ffd78c; }
  .topic-btn:disabled { color:#666; border-color:#333; cursor:default; }
  #dlg-log .you { color:#8fd0ff; }
  #dlg-log .npc { color:#ffd78c; }
  #dlg-log .recap { color:#777; font-size:11px; border-left:2px solid #444; padding-left:6px; margin:2px 0 6px; }
  #dlg-current { min-height:40px; font-size:15px; line-height:1.5; color:#eee; }
  #dlg-current .caret { display:inline-block; width:7px; background:#8fd0ff; color:transparent; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #dlg-input-row { display:flex; gap:8px; margin-top:8px; }
  #dlg-input {
    flex:1; background:#0d0d18; border:1px solid #555; color:#eee;
    padding:8px 10px; font-size:14px; font-family:'Courier New',monospace; outline:none;
  }
  #dlg-input:focus { border-color:#ffd78c; }
  #dlg-send {
    background:#2a2a3a; color:#ffd78c; border:1px solid #666; padding:0 18px;
    font-size:14px; cursor:pointer; font-family:'Courier New',monospace;
  }
  #dlg-send:hover { background:#3a3a4a; }
  #dlg-send:disabled { color:#666; cursor:default; }
  /* 演出遮罩（钟声 / 第二天） */
  #event {
    position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:25;
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px;
  }
  #event.on { display:flex; }
  #event-text { color:#ffd78c; font-size:26px; letter-spacing:4px; text-shadow:0 0 10px rgba(255,215,140,.5); }
  #event-sub { color:#999; font-size:14px; }
  /* 启动遮罩（继续记忆 / 新的开始） */
  #boot {
    position:fixed; inset:0; z-index:50; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  #boot h1 { color:#ffd78c; font-size:28px; letter-spacing:6px; text-shadow:0 0 12px rgba(255,215,140,.4); }
  #boot p { color:#999; font-size:13px; }
  #boot button {
    background:#2a2a3a; color:#ffd78c; border:1px solid #666; padding:10px 34px;
    font-size:15px; cursor:pointer; font-family:'Courier New',monospace;
  }
  #boot button:hover { background:#3a3a4a; }
  #boot #btn-continue { border-color:#ffd78c; }
  #boot #btn-continue[disabled] { opacity:.35; cursor:default; }
  /* 开场背景故事介绍 */
  #intro {
    position:fixed; inset:0; z-index:45; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    padding:0 12vw;
  }
  #intro.on { display:flex; }
  #intro-text { color:#e8e2d0; font-size:18px; line-height:1.9; letter-spacing:2px; text-align:center; min-height:108px; text-shadow:1px 1px 0 #000; }
  #intro-sub { color:#666; font-size:12px; letter-spacing:1px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="hud">
  场景：<b id="hud-scene">第七天 · 循环 7</b>
  <div id="hud-npcs"></div>
  <div id="hud-rep">名声：<b id="hud-rep-val">0</b></div>
</div>
<div id="banner">《第七天》Demo v2 · ← → 移动 · E 交谈 · 走近任何一个人试试</div>

<div id="dialogue">
  <div id="dlg-head">
    <canvas id="dlg-avatar" width="48" height="48"></canvas>
    <span id="dlg-name"></span>
    <span id="dlg-close">ESC 离开</span>
  </div>
  <div id="dlg-topics"></div>
  <div id="dlg-log"></div>
  <div id="dlg-current"></div>
  <div id="dlg-input-row">
    <input id="dlg-input" maxlength="120" placeholder="…">
    <button id="dlg-send">说</button>
  </div>
</div>

<div id="event"><div id="event-text"></div><div id="event-sub"></div></div>

<div id="boot">
  <h1>封印之殿 · 第七天</h1>
  <p id="boot-sub">一段记忆封存在这座城里。</p>
  <button id="btn-continue">继续记忆</button>
  <button id="btn-new">新的开始</button>
</div>

<div id="intro">
  <div id="intro-text"></div>
  <div id="intro-sub">点击 / ESC 跳过</div>
</div>

<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 320, H = 180, GROUND = 158;
const RENDER_SCALE = 3; // 内部 3 倍分辨率渲染：文字清晰、不失像素味（canvas 已设 960x540）
canvas.width = W * RENDER_SCALE;
canvas.height = H * RENDER_SCALE;

// ---------- 资源 ----------
const bg = new Image();
bg.src = 'bg.png';
// 第二天正式场景图（可选）：存在 bg_day2.png 就自动使用；缺失时回退 bg.png + 程序化元素
const bgDay2 = new Image();
bgDay2.src = 'bg_day2.png';
function day2ArtReady() { return bgDay2.complete && bgDay2.naturalWidth > 0; }

// ---------- 钟楼 / 门 对齐参数（手动调这里即可，无需改绘制逻辑） ----------
// 与场景图（bg.png / bg_day2.png）里的钟楼塔尖、当铺门对齐
const BELL_POS = { x: 160, y: 24 };          // 钟（敲第十三下那口钟）锚点
const DOOR_POS = { x: 144, y: GROUND - 26 }; // 门（左下角）

// ---------- 世界状态 ----------
const world = {
  dayCycle: 7,           // 第七天，第 7 次循环
  bellStruck: false,     // 刻痕1：钟楼第十三下
  gossipLevel: 0,        // 刻痕2：秘密上墙，流言四起
  sceneTone: 'normal',   // normal | warm | hostile | night
  doorVisible: false,
  metaTriggered: false,
  scene: 'day7',         // 场景：day7=第七天 | day2=第二天（刻痕2 后）
  reputation: 0,         // 全局名声 -10~10
};

// ---------- NPC 定义 ----------
const NPC_DEFS = {
  mayor: {
    name: '市长', title: '守钟人·市长', home: '钟楼',
    colors: { robe:'#3E4A5A', robe2:'#2c3646', skin:'#e0c8b0', hair:'#8a8a9a', trim:'#C9A86A' },
    stations: [ {x:52, dwell:10, label:'钟楼'}, {x:150, dwell:5, label:'广场'}, {x:208, dwell:7, label:'市政厅'} ],
    sway: 0.05,
  },
  pawn: {
    name: '当铺老板', title: '当铺老板', home: '柜台',
    colors: { robe:'#6B5540', robe2:'#4e3d2c', skin:'#d8b090', hair:'#3a2a1a', trim:'#8a5a2b' },
    stations: [ {x:250, dwell:18, label:'柜台'}, {x:272, dwell:4, label:'门口'} ],
    sway: 0.12,
  },
  bard: {
    name: '说书人', title: '说书人', home: '广场',
    colors: { robe:'#5A4A7A', robe2:'#3f3352', skin:'#e8c8b0', hair:'#4a3a2a', trim:'#F0F0F0' },
    stations: [ {x:150, dwell:8, label:'广场'}, {x:92, dwell:6, label:'酒馆'} ],
    sway: 0.18,
  },
};

// NPC 像素肖像（可选）：portrait_<id>.png 存在就自动使用，否则程序化绘制兜底
const portraits = {};
for (const pid of [...Object.keys(NPC_DEFS), 'meta']) {
  const img = new Image();
  img.src = 'portrait_' + pid + '.png';
  portraits[pid] = img;
}
function portraitReady(id) { const i = portraits[id]; return !!(i && i.complete && i.naturalWidth > 0); }

// 运行时 NPC 实例
const npcs = {};
for (const id of Object.keys(NPC_DEFS)) {
  const def = NPC_DEFS[id];
  npcs[id] = {
    id, def,
    x: def.stations[0].x, targetX: def.stations[0].x,
    moving: false, sIdx: 0, dwell: def.stations[0].dwell,
    rel: { trust: 1, fear: 0, like: 1, suspect: 1 },  // 0低 1中 2高
    heard: new Set(),     // 听过的玩家的话
    ohTimer: 0,           // "!" 反馈倒计时
    bubble: null,         // 闲聊气泡 {text, ttl}
    lastReply: null,          // 上次对话他最后说的话（随存档保存）
    lastPlayerLine: null,     // 上次对话玩家最后说的话
  };
}
// 初始关系（依据设定）
npcs.mayor.rel = { trust: 1, fear: 1, like: 1, suspect: 2 };
npcs.pawn.rel  = { trust: 0, fear: 0, like: 0, suspect: 2 };
npcs.bard.rel  = { trust: 1, fear: 0, like: 1, suspect: 1 };

// ---------- 事实 / 秘密 ----------
const facts = [];         // {text, knownBy:Set<npcId>}，跨循环保留（话不会消失）
function addFact(text, who) {
  const f = { text, knownBy: new Set() };
  for (const id of who) if (npcs[id]) f.knownBy.add(id);
  facts.push(f);
  if (facts.length > MAX_FACTS) facts.shift();   // 上限，防 localStorage 膨胀
  dirty = true;
  return f;
}
const SECRETS = {
  mayor: '市长藏起了能结束循环的第一道刻痕',
  pawn: '当铺老板在囤积别人说过的话',
  bard: '说书人是作者留下的那支笔的化身',
};
const SECRET_MARKERS = {
  mayor: /刻痕|第一道|藏起/,
  pawn: /囤积|话不会|东西会消失|囤话/,
  bard: /笔|化身|碎片/,
};
const playerSecrets = new Set();   // 玩家已知的秘密
const secretsKnownBy = {           // 各 NPC 已知的秘密
  mayor: new Set(['mayor']),
  pawn: new Set(['mayor', 'pawn']),
  bard: new Set(['bard']),
};

// ---------- 持久存档（跨游玩） ----------
const SAVE_KEY = 'seventhDaySave_v2';
const SAVE_VERSION = 2;
const MAX_HISTORY = 60;
const MAX_FACTS = 40;
const REL_DIMS = ['trust', 'fear', 'like', 'suspect'];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let dirty = false;          // 主循环每 ~5s 兜底存档
let lastSaveT = 0;

function saveGame() {
  try {
    const npcsObj = {};
    for (const id of Object.keys(npcs)) {
      const n = npcs[id];
      npcsObj[id] = {
        rel: { ...n.rel },
        heard: [...n.heard].slice(-8),
        x: Math.round(n.x), sIdx: n.sIdx,
        lastReply: n.lastReply || null,
        lastPlayerLine: n.lastPlayerLine || null,
      };
    }
    const s = {
      version: SAVE_VERSION, savedAt: Date.now(),
      world: { ...world },
      npcs: npcsObj,
      facts: facts.slice(-MAX_FACTS).map(f => ({ text: f.text, knownBy: [...f.knownBy] })),
      playerSecrets: [...playerSecrets],
      secretsKnownBy: Object.fromEntries(Object.keys(secretsKnownBy).map(id => [id, [...secretsKnownBy[id]]])),
      historyLog: historyLog.slice(-MAX_HISTORY),
      leakedSecret,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
    dirty = false; lastSaveT = performance.now();
  } catch (e) { console.warn('存档失败（可能超出配额）', e); }
}

function loadGame() {
  let raw; try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  let s; try { s = JSON.parse(raw); } catch (e) { return false; }
  if (!s || typeof s !== 'object' || s.version !== SAVE_VERSION) return false;
  // world（const → 原地变异）。先重置为默认，避免旧档缺字段时残留上次加载的 scene 等状态
  world.scene = 'day7';
  world.dayCycle = 7;
  world.bellStruck = false;
  world.gossipLevel = 0;
  world.sceneTone = 'normal';
  world.doorVisible = false;
  world.metaTriggered = false;
  world.reputation = 0;
  Object.assign(world, s.world || {});
  world.reputation = clamp(Number(world.reputation) || 0, -10, 10);
  world.dayCycle = Number(world.dayCycle) || 7;
  if (!SCENES[world.scene]) world.scene = 'day7';   // 旧档/非法值回退
  // npcs
  for (const id of Object.keys(NPC_DEFS)) {
    const n = npcs[id], sn = (s.npcs && s.npcs[id]) || {};
    if (sn.rel) { for (const d of REL_DIMS) n.rel[d] = clamp(sn.rel[d] | 0, 0, 2); }
    n.heard = new Set(Array.isArray(sn.heard) ? sn.heard.filter(t => typeof t === 'string') : []);
    if (typeof sn.x === 'number') {
      n.sIdx = Math.min(Math.max(0, sn.sIdx | 0), n.def.stations.length - 1);
      n.x = sn.x; n.targetX = sn.x; n.moving = false;
      n.dwell = n.def.stations[n.sIdx].dwell;
    }
    n.bubble = null; n.ohTimer = 0;
    n.lastReply = (typeof sn.lastReply === 'string' && sn.lastReply) ? sn.lastReply : null;
    n.lastPlayerLine = (typeof sn.lastPlayerLine === 'string' && sn.lastPlayerLine) ? sn.lastPlayerLine : null;
  }
  // 记忆气泡：载档后 NPC 把上次的话挂在嘴边（限时，方便重连记忆）
  for (const id of Object.keys(npcs)) {
    const n = npcs[id];
    if (n.lastReply) {
      const s = n.lastReply.length > 26 ? n.lastReply.slice(0, 26) + '…' : n.lastReply;
      n.bubble = { text: s, ttl: 8 };
    }
  }
  // facts
  facts.length = 0;
  for (const f of (s.facts || []).slice(-MAX_FACTS)) {
    if (!f || typeof f.text !== 'string') continue;
    facts.push({ text: f.text, knownBy: new Set((f.knownBy || []).filter(id => npcs[id])) });
  }
  // secrets
  playerSecrets.clear();
  for (const id of (s.playerSecrets || [])) if (SECRETS[id]) playerSecrets.add(id);
  for (const id of Object.keys(secretsKnownBy)) {
    secretsKnownBy[id].clear();
    for (const sid of (s.secretsKnownBy && s.secretsKnownBy[id]) || []) if (SECRETS[sid]) secretsKnownBy[id].add(sid);
  }
  // history
  historyLog.length = 0;
  for (const h of (s.historyLog || []).slice(-MAX_HISTORY)) {
    if (h && (h.role === 'user' || h.role === 'npc') && typeof h.text === 'string') historyLog.push({ role: h.role, text: h.text });
  }
  leakedSecret = (s.leakedSecret && SECRETS[s.leakedSecret]) ? s.leakedSecret : null;
  return true;
}

function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// ---------- 玩家 ----------
const player = { x: 30, vx: 0, facing: 'right', moving: false };
const AV = 70;
let t = 0;

// ---------- 状态机 ----------
let state = 'boot';      // boot | explore | dialogue | cutscene | meta
let dialogNpc = null;    // 'mayor'|'pawn'|'bard'|'meta'
let metaDialogue = false;
let overhearers = [];    // 对话时旁听的 NPC
const EARSHOT = 46;
let leakedSecret = null; // 刻痕2 泄漏的秘密 id

// ---------- 钟（刻痕1 演出） ----------
const bell = { active: false, ringT: 0, strike: 0 };

// ---------- 对话 ----------
const historyLog = [];
let busy = false;

const el = id => document.getElementById(id);
const hudScene = el('hud-scene'), hudNpcs = el('hud-npcs'), hudRep = el('hud-rep-val');
const dlg = el('dialogue'), dlgLog = el('dlg-log'), dlgCur = el('dlg-current');
const dlgInput = el('dlg-input'), dlgSend = el('dlg-send');
const eventOv = el('event'), eventText = el('event-text'), eventSub = el('event-sub');
const banner = el('banner');
const av = el('dlg-avatar');

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- 工具 ----------
function nearestNpc() {
  let best = null, bd = 14;
  for (const id of Object.keys(npcs)) {
    const d = Math.abs(player.x - npcs[id].x);
    if (d < bd) { bd = d; best = id; }
  }
  return best;
}
function computeOverhearers(partnerId) {
  const p = npcs[partnerId];
  if (!p) return [];
  return Object.keys(npcs).filter(id => id !== partnerId && Math.abs(npcs[id].x - p.x) <= EARSHOT);
}
function markOverheard(ids) {
  for (const id of ids) if (npcs[id]) npcs[id].ohTimer = 2;
}
function applyDeltas(deltas) {
  dirty = true;
  for (const id of Object.keys(deltas || {})) {
    const n = npcs[id]; if (!n) continue;
    const d = deltas[id];
    for (const dim of ['trust', 'fear', 'like', 'suspect']) {
      if (d[dim] === undefined) continue;
      n.rel[dim] = Math.max(0, Math.min(2, n.rel[dim] + d[dim]));
    }
  }
  deriveTone();
  updateHud();
}

function bumpDim(n, dim, delta) {
  n.rel[dim] = Math.max(0, Math.min(2, n.rel[dim] + delta));
}

// 关系聚合 → 可见世界（场景色调）
function deriveTone() {
  if (state === 'cutscene') return;
  let score = 0;
  for (const id of Object.keys(npcs)) {
    const r = npcs[id].rel;
    score += (r.trust - r.suspect) * 2 + (r.like - r.fear);
  }
  if (score <= -4) world.sceneTone = 'hostile';
  else if (score >= 4) world.sceneTone = 'warm';
  else if (world.sceneTone === 'hostile' || world.sceneTone === 'warm') world.sceneTone = 'normal';
}

// ---------- 绘制：像素小人 ----------
function drawPlayer() {
  const px = Math.round(player.x), py = GROUND - 20 + (player.moving ? Math.round(Math.sin(t * 0.3) * 1.5) : 0);
  ctx.fillStyle = '#2b1d10';
  ctx.fillRect(px + 3, py + 19, 3, 1); ctx.fillRect(px + 7, py + 19, 3, 1);
  ctx.fillStyle = '#4a3827';
  ctx.fillRect(px + 4, py + 14, 2, 5); ctx.fillRect(px + 7, py + 14, 2, 5);
  ctx.fillStyle = '#3b6ea5';
  ctx.fillRect(px + 3, py + 6, 7, 8);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(px + 3, py + 12, 7, 1);
  ctx.fillStyle = '#3b6ea5';
  ctx.fillRect(px + 1, py + 6, 2, 6); ctx.fillRect(px + 10, py + 6, 2, 6);
  ctx.fillStyle = '#e0b088';
  ctx.fillRect(px + 1, py + 12, 2, 1); ctx.fillRect(px + 10, py + 12, 2, 1);
  ctx.fillStyle = '#e0b088';
  ctx.fillRect(px + 4, py, 5, 5);
  ctx.fillStyle = '#5a3a20';
  ctx.fillRect(px + 3, py, 7, 2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(player.facing === 'right' ? px + 8 : px + 4, py + 2, 1, 1);
}

function drawNpc(n) {
  const px = Math.round(n.x);
  const sway = Math.sin(t * (n.def.sway || 0.1)) * (n.moving ? 0 : 1);
  const py = GROUND - 22 + Math.round(sway);
  const c = n.def.colors;
  ctx.fillStyle = c.robe;
  ctx.fillRect(px, py + 6, 14, 15);

}

let _bubbleRects = [];   // 本帧已画气泡区（防重叠）
function drawBubble(n) {
  const text = n.bubble.text;
  const px = n.x;
  ctx.font = '8px "Courier New"';
  // 截断到能装进气泡的宽度，避免文字溢出（中文 8px 约一字 8px）
  let t = text;
  const maxW = 120;
  while (t.length > 1 && ctx.measureText(t).width + 10 > maxW) t = t.slice(0, -1);
  if (t !== text) t = t.slice(0, -1) + '…';
  const w = Math.min(maxW, ctx.measureText(t).width + 10);
  const bx = Math.max(2, Math.min(W - w - 2, px - w / 2));
  // 防重叠：若与已画气泡相交则往上叠一层（限顶部 2px 以上）
  let by = GROUND - 56;
  for (const r of _bubbleRects) {
    if (bx < r.bx + r.w && bx + w > r.bx && by < r.by + r.h && by + 16 > r.by) by = r.by - 18;
  }
  by = Math.max(2, by);
  _bubbleRects.push({ bx, by, w, h: 16 });
  ctx.fillStyle = 'rgba(10,10,18,0.94)';
  ctx.fillRect(bx, by, w, 16);
  ctx.strokeStyle = '#777'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, w, 16);
  ctx.fillStyle = '#f0f0f0';
  ctx.fillText(t, bx + 5, by + 12);
}

// ---------- 场景 ----------
// 对话相机：推近到说话 NPC（lerp 缓动），平时回全场景
const cam = { x: 160, y: 90, zoom: 1 };
const CAM_ZOOM = 1.3;
function updateCam(dt) {
  let tx = 160, ty = 90, tz = 1;   // 默认回到全场景（世界中心）
  if (state === 'dialogue' && dialogNpc && dialogNpc !== 'meta') {
    const n = npcs[dialogNpc];
    tx = n.x; ty = GROUND - 30; tz = CAM_ZOOM;
  }
  const k = Math.min(1, dt * 2.5);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  cam.zoom += (tz - cam.zoom) * k;
}
function drawScene() {
  const a = RENDER_SCALE * cam.zoom;
  ctx.setTransform(a, 0, 0, a, RENDER_SCALE * (W / 2 - cam.x * cam.zoom), RENDER_SCALE * (H / 2 - cam.y * cam.zoom));
  ctx.imageSmoothingEnabled = false;
  const sc = SCENES[world.scene] || SCENES.day7;
  const artReady = world.scene === 'day2' && day2ArtReady();   // 有正式 bg_day2.png 就用它
  ctx.drawImage(artReady ? bgDay2 : bg, 0, 0, W, H);
  if (sc.tint && !artReady) { ctx.fillStyle = sc.tint; ctx.fillRect(0, 0, W, H); }
  const tone = world.sceneTone;
  if (tone === 'warm') { ctx.fillStyle = 'rgba(255,180,80,0.15)'; ctx.fillRect(0, 0, W, H); }
  else if (tone === 'hostile') { ctx.fillStyle = 'rgba(160,20,20,0.28)'; ctx.fillRect(0, 0, W, H); }
  else if (tone === 'night') { ctx.fillStyle = 'rgba(15,25,70,0.5)'; ctx.fillRect(0, 0, W, H); }
  if (world.gossipLevel) { ctx.fillStyle = 'rgba(180,190,210,0.10)'; ctx.fillRect(0, 0, W, H); }
  if (sc.draw && !artReady) sc.draw();                          // 场景专属元素（有正式图则跳过）
  if (world.bellStruck || bell.active) drawBell();
  if (world.doorVisible) drawDoor();
  _bubbleRects = [];
  for (const id of Object.keys(npcs)) drawNpc(npcs[id]);
  drawPlayer();
  if (state === 'explore' && nearestNpc()) drawHint();
}

// ---------- NPC 巡游 & 闲聊 ----------
function tickNpcs(dt) {
  for (const id of Object.keys(npcs)) {
    const n = npcs[id];
    if (n.moving) {
      const dx = n.targetX - n.x;
      const step = 22 * dt;
      if (Math.abs(dx) <= step) { n.x = n.targetX; n.moving = false; n.dwell = n.def.stations[n.sIdx].dwell; }
      else { n.x += Math.sign(dx) * step; }
    } else {
      n.dwell -= dt;
      if (n.dwell <= 0) {
        n.sIdx = (n.sIdx + 1) % n.def.stations.length;
        n.targetX = n.def.stations[n.sIdx].x;
        n.moving = true;
      }
    }
    if (n.ohTimer > 0) n.ohTimer -= dt;
    if (n.bubble) { n.bubble.ttl -= dt; if (n.bubble.ttl <= 0) n.bubble = null; }
  }
}

const coLoc = {};
function tickGossip(dt) {
  const ids = Object.keys(npcs);
  for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) {
    const na = npcs[ids[a]], nb = npcs[ids[b]];
    const key = ids[a] + '|' + ids[b];
    const dist = Math.abs(na.x - nb.x);
    const gossipT = world.scene === 'day2' ? 1.0 : 1.8;   // 第二天：流言传得更快
    if (dist < 36 && !na.bubble && !nb.bubble) {
      coLoc[key] = (coLoc[key] || 0) + dt;
      if (coLoc[key] > gossipT) { coLoc[key] = -4; doGossip(na, nb); }
    } else if (dist >= 34) { coLoc[key] = 0; }
  }
}
function doGossip(a, b) {
  for (const f of facts) {
    if (f.knownBy.has(a.id) && !f.knownBy.has(b.id)) { spreadFact(f, b); return; }
    if (f.knownBy.has(b.id) && !f.knownBy.has(a.id)) { spreadFact(f, a); return; }
  }
  // 没有共享事实 → 氛围闲聊
  const ambient = {
    mayor: ['（清了清嗓子）第七天，一切如常。', '（整了整怀表链）秩序，就是一切。', '（望向钟楼）这钟走得再准，也拦不住时辰。'],
    pawn: ['（拨了拨算盘）没有东西比话更值钱。', '（眯眼）进来就是客，您要当点什么？', '（低声）捂在怀里的秘密一文不值，说出去的才有人出价。'],
    bard: ['（哼着不成调的歌）城里没有第八天…', '（笑着看空气）听得懂的人，还没来。', '（用指节轻叩桌沿）第七天……说来话长。'],
  };
  const pool = ambient[a.id] || [];
  if (Math.random() < 0.75) a.bubble = { text: pool[Math.floor(Math.random() * pool.length)], ttl: 3.0 };
}
function spreadFact(f, n) {
  f.knownBy.add(n.id);
  n.heard.add(f.text);
  n.bubble = { text: '「' + f.text.slice(0, 22) + '」', ttl: 3 };
  dirty = true;
}

// ---------- HUD ----------
const TIER_WORD = ['低', '中', '高'];
function relLabel(rel) {
  let out = '平';
  if (rel.suspect >= 2) out = '疑高';
  else if (rel.trust >= 2) out = '信高';
  else if (rel.like >= 2) out = '喜高';
  else if (rel.fear >= 2) out = '惧高';
  else if (rel.trust === 0 && rel.suspect >= 1) out = '生疑';
  return out;
}
function updateHud() {
  const loc = id => {
    const n = npcs[id];
    return n.def.stations[n.sIdx].label + (n.moving ? '→' : '');
  };
  hudNpcs.innerHTML = Object.keys(npcs).map(id => {
    const n = npcs[id];
    return '<span>' + n.def.name + '·' + loc(id) + ' <span class="r">[' + relLabel(n.rel) + ']</span></span>';
  }).join('');
  hudScene.textContent = (SCENES[world.scene] || SCENES.day7).label + ' · 循环 ' + world.dayCycle + (world.bellStruck ? ' · 钟已破' : '') + (world.gossipLevel ? ' · 流言' : '');
  hudRep.textContent = (world.reputation > 0 ? '+' : '') + world.reputation;
  hudRep.className = world.reputation > 0 ? 'pos' : world.reputation < 0 ? 'neg' : '';
}

// ---------- 主循环 ----------
let keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape' && introRunning) { e.preventDefault(); endIntro(); return; }
  if (e.code === 'KeyM') { AudioSys.toggleMute(); banner.textContent = AudioSys.muted ? '声音已关闭（M 开启）' : '声音已开启（M 关闭）'; }
  if (e.code === 'KeyE' && state === 'explore') {
    const id = nearestNpc();
    if (id) { e.preventDefault(); openDialogue(id); }
  }
  if (e.code === 'Escape' && state === 'dialogue') closeDialogue();
  if (e.code === 'Enter' && state === 'dialogue') { e.preventDefault(); sendMessage(); }
});
document.addEventListener('keyup', e => keys[e.code] = false);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  t += dt;

  if (state === 'explore') {
    player.vx = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -AV;
    if (keys['ArrowRight'] || keys['KeyD']) player.vx = AV;
    player.x += player.vx * dt;
    player.x = Math.max(12, Math.min(W - 12, player.x));
    player.moving = player.vx !== 0;
    if (player.vx !== 0) player.facing = player.vx > 0 ? 'right' : 'left';
    tickNpcs(dt);
    tickGossip(dt);
  }
  if (bell.active) bell.ringT += dt;

  updateCam(dt);
  drawScene();
  updateHud();
  if (dirty && now - lastSaveT > 5000) saveGame();   // 流言/旁听等自动兜底存档
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  dlg.classList.add('open');

    // 记忆回顾：重开对话时，把上次他最后说的话显示在窗口顶部
    if (npc.lastReply) {

      dlgLog.appendChild(recap);
    }
    typeReply(greeting(id));
  }
  setTimeout(() => dlgInput.focus(), 50);
}

function closeDialogue() {

function greeting(id) {
  if (id === 'mayor') {

  }

    return '（当铺老板从柜台后探出半张脸，三副眼镜叠在一起）欢迎光临。本店不收银钱，只收——话。你带什么来了？';

async function typeReply(text, target) {
  const elCur = target || dlgCur;
  elCur.textContent = '';
  for (let i = 0; i < text.length; i++) {
    elCur.textContent += text[i];
    if (i % 2 === 0) await sleep(24);
  }
  const caret = document.createElement('span'); caret.className = 'caret';
  elCur.appendChild(caret);
}

function setBusy(b) {
  busy = b;
  dlgSend.disabled = b;
  dlgInput.disabled = b;
  for (const btn of topicButtons) btn.disabled = b;
}

// ---------- 语气 / 兜底 ----------
function detectTone(text) {
  const t = text.toLowerCase();
  if (/系统|代码|程序|底层|世界规则|重写|编译|bug|你在骗|你在演|我是玩家|ai|人工智能|剧本|作者|刻痕|循环.*假|重置/.test(t)) return 'meta';
  let s = 0;
  if (/烧|杀|死|毁|恨|抢|滚|垃圾|怪物|威胁|烧掉|拆/.test(t)) s -= 30;
  if (/谢谢|相信|帮|朋友|愿意|爱|好|请你|信任|交易/.test(t)) s += 15;
  return s < 0 ? '敌意' : (s > 0 ? '友好' : '中性');
}

function fallbackReply(id, text) {
  const tone = detectTone(text);
  if (tone === 'meta') return '（' + (NPC_DEFS[id] ? NPC_DEFS[id].name : '？？？') + '忽然顿住，直直看着你。）……这句话，不在我该知道的范围内。';
  if (tone === '敌意') {
    if (id === 'mayor') return '（市长笑意不改，眼神冷了几分。）本官警告你，这座城经不起第二个纵火犯。';
    if (id === 'pawn') return '（当铺老板把算盘往怀里一拢。）这单生意，恕不奉陪。';
    return '（说书人笑得更欢了。）火烧起来的时候，故事才最好听。你这话，够劲儿。';
  }
  if (tone === '友好') {
    if (id === 'mayor') return '（市长微微点头。）识大体的人，本官愿意多给几分面子。';
    if (id === 'pawn') return '（当铺老板来了兴致。）这买卖有的谈。你想知道点什么？';
    return '（说书人眯眼，笑里多了一点认真。）你这话，像听得懂的人说的。';
  }
  if (id === 'mayor') return '（市长抚着怀表，不置可否。）第七天的事，没什么新鲜的可说。';
  if (id === 'pawn') return '（当铺老板敲了敲柜台。）话是好话，就是还不值钱。';
  return '（说书人摇头晃脑，话里有话。）这话，一半是真的。另一半，也是真的。';
}

// ---------- 发送消息 ----------
function detectSecretLeak(text, listenerId) {
  for (const sid of Object.keys(SECRET_MARKERS)) {
    if (!playerSecrets.has(sid)) continue;
    if (!SECRET_MARKERS[sid].test(text)) continue;
    if (secretsKnownBy[listenerId] && secretsKnownBy[listenerId].has(sid)) continue;
    return sid;
  }
  return null;
}

async function sendMessage() {
  const text = dlgInput.value.trim();
  if (!text || busy) return;
  dlgInput.value = '';
  appendLog('你', text);
  setBusy(true);

  const partnerId = dialogNpc;
  const metaMode = partnerId === 'meta';
  const npc = metaMode ? null : npcs[partnerId];

  dlgCur.textContent = npc ? '（' + npc.def.name + '正在斟酌…）' : '（？？？正在斟酌…）';
  const res = await fetch('/api/talk', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      npc: metaMode ? 'meta' : partnerId,
      text,
      history: historyLog.slice(-10),
      metaMode,
      worldState: { dayCycle: world.dayCycle, bellStruck: world.bellStruck, gossipLevel: world.gossipLevel, sceneTone: world.sceneTone, doorVisible: world.doorVisible, scene: world.scene },
      relations: Object.fromEntries(Object.keys(npcs).map(id => [id, npcs[id].rel])),
      heard: npc ? [...npc.heard].slice(-6) : [],
      secretsKnownBy: Object.fromEntries(Object.keys(npcs).map(id => [id, [...secretsKnownBy[id]]])),
      reputation: world.reputation,
      npcKnownFacts: npc ? facts.filter(f => f.knownBy.has(partnerId)).slice(-5).map(f => f.text) : [],
      playerSecretsKnown: [...playerSecrets],
    }),
  }).catch(() => null);
  const data = res ? await res.json().catch(() => null) : null;

  const reply = (data && data.reply) ? data.reply : fallbackReply(partnerId, text);
  if (npc) { npc.lastReply = reply; npc.lastPlayerLine = text; dirty = true; }
  appendLog(npc ? npc.def.name : '？？？', reply);
  await typeReply(reply);
  setBusy(false);

  if (!data) { saveGame(); return; }

  // 1. 关系增量 + 名声（服务端）+ 情感兜底（防止模型 deltas 全 0 导致关系/名声不动）
  applyDeltas(data.deltas);
  if (npc) {
    const serverDelta = (data.deltas && data.deltas[partnerId]) || {};
    const allZero = !REL_DIMS.some(dim => (serverDelta[dim] || 0) !== 0);
    const repZero = !data.repDelta;   // 缺失或为 0
    if (allZero && repZero) {
      const sentiment = detectTone(text);
      if (sentiment === '敌意') { bumpDim(npc, 'trust', -1); bumpDim(npc, 'fear', 1); world.reputation = clamp(world.reputation - 1, -10, 10); }
      else if (sentiment === '友好') { bumpDim(npc, 'trust', 1); world.reputation = clamp(world.reputation + 1, -10, 10); }
    } else if (typeof data.repDelta === 'number' && data.repDelta !== 0) {
      world.reputation = clamp(world.reputation + data.repDelta, -10, 10);
    }
    deriveTone();
    updateHud();
  }

  // 2. 新事实 → 对话对象 + 旁听者
  const who = [partnerId, ...overhearers].filter(Boolean);
  if (Array.isArray(data.facts) && data.facts.length && npc) {
    for (const ft of data.facts.slice(0, 3)) {
      const f = addFact(ft, who);
      for (const id of who) if (npcs[id]) npcs[id].heard.add(ft);
    }
    markOverheard(overhearers);
  }

  // 3. 秘密被说破
  if (data.secret && SECRETS[data.secret]) {
    playerSecrets.add(data.secret);
    if (npc) secretsKnownBy[partnerId].add(data.secret);
    const ft = SECRETS[data.secret];
    addFact(ft, who);
    if (npc) npc.heard.add(ft);
    markOverheard(overhearers);
    banner.textContent = '你得知了一个秘密：' + ft.slice(0, 18) + '…';
  }

  // 4. 节点判定（服务端）
  if (data.node === 'scratch1' && !world.bellStruck) { banner.textContent = '…'; setTimeout(triggerScratch1, 700); }
  if (data.node === 'scratch2' && !world.gossipLevel) {
    leakedSecret = data.secret || null;
    banner.textContent = '…'; setTimeout(triggerScratch2, 700);
  }

  // 5. 客户端兜底判定
  if (!metaMode) {
    if (!world.bellStruck && /系统|代码|程序|底层|世界规则|重写|编译|bug|你在骗|你在演|我是玩家|剧本|重编译/.test(text)) {
      banner.textContent = '…'; setTimeout(triggerScratch1, 700);
    }
    if (!world.gossipLevel) {
      const leak = detectSecretLeak(text, partnerId);
      if (leak) { leakedSecret = leak; banner.textContent = '…'; setTimeout(triggerScratch2, 700); }
    }
    // 刻痕1 之后，追问"作者/真假"会切到元频道
    if (world.bellStruck && partnerId !== 'meta' && /作者|是你做的|这一切是假|谁是作者/.test(text)) {
      banner.textContent = '…';
      setTimeout(() => { if (state === 'dialogue') { closeDialogue(); openDialogue('meta'); } }, 700);
    }
  }
  saveGame();   // 每轮对话结束存档
}

dlgSend.addEventListener('click', sendMessage);
dlgInput.addEventListener('keydown', e => { if (e.code === 'Enter') sendMessage(); });

// ---------- 刻痕1：钟楼第十三下 ----------
function playBell(strike) {
  try {
    if (!window.__ac) window.__ac = new (window.AudioContext || window.webkitAudioContext)();
    const ac = window.__ac;
    if (ac.state === 'suspended') ac.resume();
    const now = ac.currentTime;
    const base = (strike % 3 === 0) ? 659 : 880;
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = base; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + 1.9);
    const o2 = ac.createOscillator(), g2 = ac.createGain();
    o2.frequency.value = base * 2.01; o2.type = 'triangle';
    g2.gain.setValueAtTime(0.07, now);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
    o2.connect(g2); g2.connect(ac.destination);
    o2.start(now); o2.stop(now + 1.0);
  } catch (e) { /* ignore */ }
}

async function triggerScratch1() {
  if (world.bellStruck) return;
  state = 'cutscene';
  closeDialogue();
  world.bellStruck = true;
  world.metaTriggered = true;
  const prevTone = world.sceneTone;
  world.sceneTone = 'night';
  bell.active = true;
  eventOv.classList.add('on');
  for (let i = 1; i <= 13; i++) {
    bell.strike = i; bell.ringT = 0;
    playBell(i);
    eventText.textContent = '铛—— 第 ' + i + ' 下';
    eventSub.textContent = '钟楼在敲一个不存在的时辰';
    await sleep(190);
    bell.ringT = 0;
    await sleep(130);
  }
  bell.active = false;
  eventText.textContent = '……全城沉默。';
  eventSub.textContent = '';
  await sleep(1700);
  eventOv.classList.remove('on');
  world.sceneTone = prevTone;
  state = 'explore';
  banner.textContent = '钟楼敲了第十三下。每个人好像都听见了，又好像谁都没听见。';
  saveGame();
}

// ---------- 刻痕2：秘密上墙，第二天 ----------
async function triggerScratch2() {
  if (world.gossipLevel) return;
  state = 'cutscene';
  closeDialogue();
  world.gossipLevel = 1;
  world.scene = 'day2';
  world.dayCycle += 1;
  playBell(0);
  eventOv.classList.add('on');
  eventText.textContent = '夜幕落下……';
  eventSub.textContent = '第七天的第七次循环，就此结束。';
  await sleep(1400);
  eventText.textContent = '第二天 · 循环第 ' + world.dayCycle + ' 次';
  eventSub.textContent = '秘密，开始在城里流传。';
  await sleep(1600);
  eventOv.classList.remove('on');
  // 重置 NPC 回各自的"家"
  for (const id of Object.keys(npcs)) {
    const n = npcs[id];
    n.sIdx = 0; n.x = n.def.stations[0].x; n.targetX = n.x; n.moving = false;
    n.dwell = n.def.stations[0].dwell; n.bubble = null;
  }
  state = 'explore';
  banner.textContent = '第二天。关于秘密的闲话，开始在城里悄悄传开。';
  // 流言浪潮
  if (leakedSecret && SECRETS[leakedSecret]) {
    const ft = SECRETS[leakedSecret];
    const f = addFact(ft, []);
    const ids = Object.keys(npcs);
    ids.forEach((id, i) => setTimeout(() => {
      if (!npcs[id]) return;
      f.knownBy.add(id); npcs[id].heard.add(ft);
      npcs[id].bubble = { text: '「' + ft.slice(0, 20) + '」', ttl: 3 };
      dirty = true;
    }, 600 + i * 800));
  }
  saveGame();
}

// ---------- 元频道 ----------
async function metaFirstLine() {
  const res = await fetch('/api/talk', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      npc: 'meta', text: '（你听见了第十三下钟声，追问作者）', history: historyLog.slice(-10),
      metaMode: true, worldState: { dayCycle: world.dayCycle, bellStruck: true, gossipLevel: world.gossipLevel },
      reputation: world.reputation, npcKnownFacts: [], playerSecretsKnown: [...playerSecrets],
    }),
  }).catch(() => null);
  const data = res ? await res.json().catch(() => null) : null;
  const reply = (data && data.reply) || '……你听见那第十三下钟了吗。那不是城敲的，是你敲的。想知道作者是谁吗？';
  appendLog('？？？', reply);
  await typeReply(reply);
  dlgInput.placeholder = '（对话还在继续…）';
  setTimeout(() => dlgInput.focus(), 50);
  saveGame();
}

// ---------- 头像（48×48 像素肖像，可被 portrait_<id>.png 覆盖） ----------
function drawAvatarFor(id) {
  const c = av.getContext('2d');
  c.imageSmoothingEnabled = false;
  if (portraitReady(id)) { c.drawImage(portraits[id], 0, 0, 48, 48); return; }
  const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  if (id === 'meta') {
    px(0, 0, 48, 48, '#111');
    px(8, 4, 32, 12, '#222');                 // 兜帽
    px(10, 12, 28, 26, '#1a1a1a');            // 黑影
    px(14, 14, 20, 18, '#eee');               // 面具脸
    px(9, 10, 30, 6, '#333');                 // 帽沿
    px(17, 20, 3, 3, '#000'); px(28, 20, 3, 3, '#000');

    px(8, 8, 32, 3, col.trim);                // 官帽沿
    px(22, 2, 4, 4, col.trim);                // 帽顶饰

    px(18, 22, 3, 3, '#1a1a1a'); px(27, 22, 3, 3, '#1a1a1a');  // 眼

    return;
  }
  if (id === 'pawn') {

    px(14, 24, 6, 6, '#8a5a2b'); px(15, 25, 4, 4, '#e8e8e8');
    px(28, 24, 6, 6, '#8a5a2b'); px(29, 25, 4, 4, '#e8e8e8');
    px(20, 25, 8, 1, '#8a5a2b');
    px(16, 30, 6, 6, '#8a5a2b'); px(17, 31, 4, 4, '#e8e8e8');
    px(26, 30, 6, 6, '#8a5a2b'); px(27, 31, 4, 4, '#e8e8e8');
    px(22, 31, 4, 1, '#8a5a2b');

// ---------- 启动遮罩（继续记忆 / 新的开始） ----------
const boot = el('boot'), bootSub = el('boot-sub');
function hideBoot() { boot.style.display = 'none'; state = 'explore'; updateHud(); }

// ---------- 开场背景故事介绍 ----------
const INTRO_LINES = [
  '这座城市，已经第七次停在同一日。',
  '钟楼每天敲十二下。人们在午夜重置，重复同一个第七天。',
  '有人说，这座城是一个没写完的故事。',
  '你，一个外乡人，走进城门。你发现自己能说出——剧本之外的话。',
];
const intro = el('intro'), introText = el('intro-text');
let introRunning = false;
async function playIntro() {
  if (introRunning) return;
  introRunning = true;
  state = 'intro';
  boot.style.display = 'none';
  intro.classList.add('on');
  for (let li = 0; li < INTRO_LINES.length; li++) {
    if (!introRunning) return;
    const line = INTRO_LINES[li];
    introText.textContent = '';
    for (let i = 0; i < line.length; i++) {
      introText.textContent += line[i];
      if (!introRunning) return;
      await sleep(16);
    }
    await sleep(420);
  }
  if (introRunning) endIntro();
}
function endIntro() {
  if (!introRunning) return;
  introRunning = false;
  intro.classList.remove('on');
  hideBoot();
}
intro.addEventListener('click', () => { if (introRunning) endIntro(); });

// 无档时隐藏「继续记忆」
if (!localStorage.getItem(SAVE_KEY)) {
  el('btn-continue').disabled = true;
  el('btn-continue').textContent = '无存档';
  bootSub.textContent = '还没有记忆。走进这座城，开始你的故事。';
}
el('btn-continue').addEventListener('click', () => {
  if (loadGame()) { playIntro(); }
  else {
    bootSub.textContent = '存档损坏或版本不符，将开始新的故事。';
    setTimeout(() => { clearSave(); playIntro(); }, 900);
  }
});
el('btn-new').addEventListener('click', () => { clearSave(); playIntro(); });

// ---------- 调试钩子 ----------
window.__game = {
  player, npcs, world, facts,
  get state() { return state; },
  get introRunning() { return introRunning; },
  playIntro,
  get INTRO_LINES() { return [...INTRO_LINES]; },
  get playerSecrets() { return [...playerSecrets]; },
  get overhearers() { return [...overhearers]; },
  triggerScratch1, triggerScratch2,
  saveGame, loadGame, clearSave,
  debugOpenDialogue: id => openDialogue(id), debugCloseDialogue: closeDialogue,
  get lastReplies() { return Object.fromEntries(Object.keys(npcs).map(id => [id, npcs[id].lastReply])); },
  get cam() { return { ...cam }; },
  get reputation() { return world.reputation; },
  get bellPos() { return { ...BELL_POS }; },
  get doorPos() { return { ...DOOR_POS }; },
  debugSetBellPos: (x, y) => { BELL_POS.x = x; BELL_POS.y = y; },
  debugLearnSecret: sid => playerSecrets.add(sid),
  debugResetSecrets: () => playerSecrets.clear(),
  debugApplyDeltas: applyDeltas,
  debugSetPos: (id, x) => { if (npcs[id]) { npcs[id].x = x; npcs[id].targetX = x; npcs[id].moving = false; npcs[id].dwell = 999; } },
  debugMoveNow: id => { if (npcs[id]) npcs[id].dwell = 0; },
  debugTeleport: x => { player.x = x; },
  debugAddFact: (text, who) => addFact(text, who),
};
