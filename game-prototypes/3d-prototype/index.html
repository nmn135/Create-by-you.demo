<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>封印之殿 — Sealed Hall</title>
  <style>
    /* ========== 全局重置 ========== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", "STSong", serif;
    }

    /* ========== 画布容器 ========== */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #canvas-container canvas {
      display: block;
    }

    /* ========== 信息覆盖层 ========== */
    #info-overlay {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    #info-overlay .title-zh {
      font-size: 22px;
      font-weight: 700;
      color: #e8dcc8;
      letter-spacing: 0.12em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      line-height: 1.3;
    }

    #info-overlay .title-en {
      font-size: 13px;
      font-weight: 400;
      color: #a09880;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      margin-top: 2px;
      font-family: "Cormorant Garamond", "EB Garamond", "Georgia", "Times New Roman", serif;
    }

    #info-overlay .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, rgba(200, 180, 140, 0.7), transparent);
      margin-top: 8px;
    }

    /* ========== NPC 标签层 ========== */
    #labels-container {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .npc-label {
      position: absolute;
      transform: translate(-50%, -120%);
      font-size: 13px;
      font-weight: 600;
      color: #e0d8c8;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      letter-spacing: 0.06em;
      font-family: "Noto Serif SC", serif;
    }

    .npc-label::after {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin: 4px auto 0;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    .npc-label.liana  { color: #6fbf6f; }
    .npc-label.baruk  { color: #d4a843; }
    .npc-label.margaret { color: #e8e0d8; }
    .npc-label.rog    { color: #c4544a; }
    .npc-label.guardian { color: #5cc8d8; }

    /* 公共模式选中对话对象时高亮 */
    .npc-label.active-talk {
      color: #f0e8d8;
      text-shadow: 0 0 12px rgba(255, 220, 150, 0.7);
    }
    .npc-label.active-talk::after {
      box-shadow: 0 0 12px currentColor;
    }

    /* ========== 底部提示 ========== */
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 11px;
      color: rgba(120, 110, 90, 0.6);
      letter-spacing: 0.08em;
      pointer-events: none;
      user-select: none;
      font-family: "Noto Serif SC", serif;
    }

    /* ========== 屏幕色温叠加层 ========== */
    #color-temp-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      transition: background-color 0.8s ease;
      background-color: transparent;
    }

    /* ========== 对话模拟面板 ========== */
    #dialogue-panel {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      width: min(640px, 90vw);
      background: rgba(10, 8, 6, 0.85);
      border: 1px solid rgba(180, 150, 100, 0.22);
      border-radius: 4px;
      padding: 18px 22px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      font-family: "Noto Serif SC", serif;
      letter-spacing: 0.04em;
      box-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
    }
    #dialogue-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #dialogue-panel .dialogue-speaker {
      font-size: 13px;
      font-weight: 700;
      color: #c8b080;
      margin-bottom: 4px;
    }
    #dialogue-panel .dialogue-text {
      font-size: 14px;
      color: #d8d0c0;
      line-height: 1.7;
      margin-bottom: 10px;
    }
    #dialogue-panel .dialogue-system {
      font-size: 13px;
      color: #988870;
      font-style: italic;
      line-height: 1.6;
    }
    #dialogue-panel .dialogue-hint {
      font-size: 11px;
      color: #605848;
      margin-top: 10px;
      text-align: right;
      border-top: 1px solid rgba(180, 150, 100, 0.12);
      padding-top: 6px;
    }

    /* ========== 加载指示器 ========== */
    #opening-overlay {
      position: fixed; inset: 0; z-index: 9000; background: #05070c;
      display: flex; align-items: center; justify-content: center;
      opacity: 1; transition: opacity 1.2s ease;
    }
    #opening-overlay.done { opacity: 0; pointer-events: none; }
    #opening-inner { max-width: 720px; padding: 40px; text-align: center; }
    #opening-title { font-size: 42px; letter-spacing: 14px; color: #cfe8f0; margin-bottom: 42px;
      text-shadow: 0 0 30px rgba(92,200,216,0.5); }
    #opening-text { font-size: 17px; line-height: 2.0; color: #b8c8d0; min-height: 160px; white-space: pre-wrap; }
    #opening-cursor { display: inline-block; width: 10px; height: 20px; background: #5cc8d8;
      vertical-align: -3px; animation: opCursor 0.8s steps(1) infinite; }
    @keyframes opCursor { 0%,49% {opacity:1} 50%,100% {opacity:0} }
    #opening-continue { margin-top: 30px; font-size: 13px; color: #6a8a96; letter-spacing: 4px; }
    #opening-enter { margin-top: 30px; padding: 10px 34px; font-size: 16px; letter-spacing: 4px;
      background: rgba(92,200,216,0.12); color: #a8e0ea; border: 1px solid rgba(92,200,216,0.5);
      border-radius: 6px; cursor: pointer; }
    #opening-enter:hover { background: rgba(92,200,216,0.25); }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c8b080;
      animation: loadPulse 1.2s ease-in-out infinite;
    }
    @keyframes loadPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%      { opacity: 1.0; transform: scale(1.4); }
    }

    /* ========== 新增：环境状态指示器 ========== */
    #env-indicator {
      position: fixed;
      top: 98px;
      left: 28px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      user-select: none;
    }
    #env-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
      transition: background-color 0.5s ease, box-shadow 0.5s ease;
      flex-shrink: 0;
    }
    #env-text {
      font-size: 12px;
      color: #a09880;
      letter-spacing: 0.05em;
      font-family: "Noto Serif SC", serif;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    /* ========== 新增：对话历史面板 ========== */
    #chat-history {
      position: fixed;
      right: 16px;
      top: 100px;
      z-index: 15;
      width: 300px;
      max-height: 55vh;
      background: rgba(10, 8, 6, 0.82);
      border: 1px solid rgba(180, 150, 100, 0.18);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      font-family: "Noto Serif SC", serif;
      pointer-events: auto;
      box-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    #chat-history-header {
      font-size: 11px;
      color: #706858;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(180,150,100,0.1);
      letter-spacing: 0.06em;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #chat-history-header:hover { color: #9a8a6a; }
    #chat-history.collapsed { width: auto; max-height: none; }
    #chat-history.collapsed #chat-history-list { display: none; }
    #chat-history.collapsed .chat-fold-icon { transform: rotate(-90deg); }
    .chat-fold-icon { transition: transform 0.2s; font-size: 10px; color: #8a7a5a; }
    #chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: calc(55vh - 36px);
      scrollbar-width: thin;
      scrollbar-color: rgba(180,150,100,0.2) transparent;
    }
    #chat-history-list::-webkit-scrollbar {
      width: 4px;
    }
    #chat-history-list::-webkit-scrollbar-thumb {
      background: rgba(180,150,100,0.2);
      border-radius: 2px;
    }

    .chat-msg {
      font-size: 12px;
      line-height: 1.55;
      padding: 5px 8px;
      border-radius: 3px;
      letter-spacing: 0.03em;
      animation: msgFadeIn 0.25s ease;
    }
    .chat-msg.player {
      text-align: right;
      color: #7cc87c;
      background: rgba(60,100,60,0.12);
      align-self: flex-end;
      max-width: 85%;
    }
    .chat-msg.npc {
      text-align: left;
      color: #d8d0c0;
      background: rgba(40,35,30,0.4);
      align-self: flex-start;
      max-width: 90%;
    }
    .chat-msg.npc .npc-name {
      font-weight: 700;
      font-size: 10px;
      margin-bottom: 2px;
      opacity: 0.8;
    }
    .chat-msg.system {
      text-align: center;
      color: #887860;
      font-style: italic;
      background: transparent;
      align-self: center;
      max-width: 95%;
    }
    .chat-msg.faux-pas {
      border: 1px solid rgba(200,60,60,0.6);
      animation: fauxPasFlash 0.8s ease 3;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fauxPasFlash {
      0%, 100% { border-color: rgba(200,60,60,0.2); }
      50%      { border-color: rgba(255,60,60,0.9); }
    }

    /* ========== 新增：对话输入区域 ========== */
    #chat-input-area {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      pointer-events: auto;
    }

    /* 对话模式切换按钮 */
    .chat-mode-btn {
      width: 52px;
      height: 28px;
      border: 1px solid rgba(180,150,100,0.25);
      border-radius: 3px;
      background: rgba(10,8,6,0.75);
      color: #887860;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
      font-family: "Noto Serif SC", serif;
      flex-shrink: 0;
      white-space: nowrap;
      padding: 0 4px;
    }
    .chat-mode-btn:hover {
      border-color: rgba(200,170,120,0.5);
      color: #b8a888;
      background: rgba(20,16,10,0.85);
    }
    .chat-mode-btn.active {
      border-color: rgba(180,150,100,0.6);
      color: #e0d0b0;
      background: rgba(30,25,15,0.9);
      box-shadow: 0 0 8px rgba(180,150,100,0.15);
    }
    .chat-mode-btn.whisper-selected {
      border-color: rgba(160,100,220,0.7);
      color: #c8a0f0;
      background: rgba(30,15,40,0.85);
      box-shadow: 0 0 10px rgba(140,80,200,0.2);
    }

    /* 输入框容器 */
    #chat-input-wrapper {
      position: relative;
      flex: 1;
    }
    #chat-input {
      width: 420px;
      min-height: 36px;
      max-height: 100px;
      padding: 8px 36px 8px 12px;
      background: rgba(10,8,6,0.78);
      border: 1px solid rgba(180,150,100,0.25);
      border-radius: 3px;
      color: #d8d0c0;
      font-size: 13px;
      font-family: "Noto Serif SC", serif;
      letter-spacing: 0.04em;
      resize: none;
      outline: none;
      transition: border-color 0.2s ease;
      line-height: 1.5;
    }
    #chat-input::placeholder {
      color: #605848;
    }
    #chat-input:focus {
      border-color: rgba(200,170,120,0.55);
      box-shadow: 0 0 8px rgba(180,150,100,0.08);
    }
    #chat-input.loading {
      opacity: 0.55;
      pointer-events: none;
    }

    /* 发送/加载指示器 */
    #chat-send-indicator {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 16px;
      height: 16px;
      pointer-events: none;
      display: none;
    }
    #chat-send-indicator.visible {
      display: block;
    }
    #chat-send-indicator .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(180,150,100,0.25);
      border-top-color: #c8b080;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 阶段推进按钮 */
    #phase-advance-btn {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 4px 14px;
      font-size: 11px;
      font-family: "Noto Serif SC", serif;
      color: #887050;
      background: rgba(10,8,6,0.7);
      border: 1px solid rgba(180,150,100,0.2);
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      pointer-events: auto;
    }
    #phase-advance-btn:hover {
      border-color: rgba(200,160,100,0.5);
      color: #c8a870;
      background: rgba(20,15,8,0.85);
    }
    /* 出场节奏提示时按钮呼吸闪烁 */
    #phase-advance-btn.attention {
      animation: btnPulse 1.5s ease-in-out infinite;
      border-color: rgba(220,180,110,0.6);
      color: #e8c890;
    }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(200,160,100,0); }
      50% { box-shadow: 0 0 14px rgba(200,160,100,0.35); }
    }
    #phase-advance-btn:disabled {
      opacity: 0.4;
      cursor: default;
      animation: none;
      box-shadow: none;
    }

    /* 悄悄话选择提示 */
    #whisper-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      font-size: 14px;
      color: #c8a0f0;
      background: rgba(10,8,6,0.88);
      border: 1px solid rgba(160,100,220,0.35);
      border-radius: 4px;
      padding: 12px 24px;
      letter-spacing: 0.06em;
      pointer-events: none;
      font-family: "Noto Serif SC", serif;
      display: none;
    }
    #whisper-prompt.visible {
      display: block;
    }

    /* NPC 标签在悄悄话选择模式下可点击 */
    #labels-container.selecting .npc-label {
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.15s ease, color 0.15s ease;
    }
    #labels-container.selecting .npc-label:hover {
      transform: translate(-50%, -120%) scale(1.15);
      color: #c8a0f0;
      text-shadow: 0 0 10px rgba(160,100,220,0.5);
    }
    /* 守护灵不可选为悄悄话目标 */
    #labels-container.selecting .npc-label.guardian {
      pointer-events: none;
      opacity: 0.4;
    }

    /* ========== 新增：关系网可视化悬浮面板 ========== */
    #relationship-panel {
      position: fixed;
      right: 26px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 18;
      width: 500px;
      background: rgba(10, 8, 6, 0.72);
      border: 1px solid rgba(180, 150, 100, 0.2);
      border-radius: 6px;
      padding: 14px 16px 12px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.55);
      font-family: "Noto Serif SC", serif;
      letter-spacing: 0.03em;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #relationship-panel.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .rel-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .rel-title {
      font-size: 18px;
      font-weight: 700;
      color: #d8cba0;
      letter-spacing: 0.12em;
    }
    .rel-subtitle {
      font-size: 11px;
      color: #8a7e62;
      letter-spacing: 0.05em;
    }
    #relationship-canvas {
      display: block;
      width: 460px;
      height: 420px;
      margin-top: 10px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.2);
    }
    .rel-footer {
      font-size: 11px;
      color: #8a7a5e;
      text-align: center;
      margin-top: 9px;
      border-top: 1px solid rgba(180, 150, 100, 0.12);
      padding-top: 8px;
      letter-spacing: 0.04em;
    }

    /* ========== 新增：可视线索面板（对话提示条） ========== */
    #hints-container {
      position: fixed;
      bottom: 108px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 19;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: min(600px, 88vw);
      pointer-events: none;
    }

    /* 模型加载状态条（诊断用，hint 上方） */
    #model-status {
      position: fixed;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2500;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 11px;
      color: #6a7a82;
      pointer-events: none;
      max-width: 90vw;
    }
    #model-status .ms-item { background: rgba(8, 12, 16, 0.6); padding: 1px 8px; border-radius: 10px; }
    #model-status .ms-ok { color: #7fe8a8; }
    #model-status .ms-warn { color: #ffc46b; }
    #model-status .ms-err { color: #ff7b6b; }
    .hint-card {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      padding: 8px 12px 8px 10px;
      background: rgba(24, 20, 12, 0.82);
      border: 1px solid rgba(212, 168, 67, 0.5);
      border-radius: 3px;
      color: #d8c8a0;
      font-size: 12.5px;
      font-style: italic;
      line-height: 1.55;
      letter-spacing: 0.03em;
      box-shadow: 0 0 12px rgba(212, 168, 67, 0.12), 0 2px 16px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(6px);
      animation: hintFadeIn 0.4s ease forwards;
      font-family: "Noto Serif SC", serif;
    }
    .hint-card.removing {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .hint-card .hint-icon {
      flex-shrink: 0;
      font-size: 14px;
      line-height: 1.3;
    }
    .hint-card .hint-text {
      flex: 1;
    }
    .hint-card .hint-close {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: #8a7a5e;
      font-size: 13px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1.2;
      font-family: inherit;
    }
    .hint-card .hint-close:hover {
      color: #d8c8a0;
    }
    @keyframes hintFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ========== 新增：NPC 微反应插话卡片 ========== */
    .chat-msg.interjection {
      align-self: stretch;
      border-left: 3px solid #d4a843;
      background: rgba(212, 168, 67, 0.15);
      color: #d8d0c0;
      margin-left: 2px;
      padding-left: 10px;
      font-size: 11.5px;
    }
    .chat-msg.interjection .interj-label {
      display: inline-block;
      font-size: 9px;
      color: #a09880;
      background: rgba(180, 150, 100, 0.15);
      border-radius: 2px;
      padding: 1px 5px;
      margin-bottom: 3px;
      letter-spacing: 0.08em;
    }
    .chat-msg.interjection .interj-npc {
      font-weight: 700;
      font-size: 11px;
      margin-right: 4px;
    }

    /* ========== 新增：悄悄话交易选择条 ========== */
    #trade-bar {
      position: fixed;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 19;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: rgba(10, 8, 6, 0.82);
      border: 1px solid rgba(160, 100, 220, 0.25);
      border-radius: 3px;

  <!-- ==================== Import Map ==================== -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "three/examples/jsm/libs/fflate.module.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/fflate.module.js"
      }
    }
  </script>

  <!-- ==================== 主脚本 ==================== -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { ModelManager } from './src/models.js';
import { AmbientAudio } from './src/audio.js';
    import { Guidance } from './src/guidance.js';
    import { SceneMarkers } from './src/markers.js';
    import { initDraggableUI } from './src/ui_drag.js';
    import { FPSController } from './src/fps_controller.js';
    import { Atmosphere } from './src/atmosphere.js';
    import { Settings } from './src/settings.js';
    import { Props } from './src/props.js';
    import { PerfMonitor } from './src/perf.js';

    // NPC 入场阶段表（必须在任何模型加载回调前初始化，避免 TDZ）
    const NPC_ENTRANCE_STAGE = { rog: 1, baruk: 2, liana: 3, margaret: 4 };

    // 引导系统实例（自包含 DOM；供全局各流程调用）
    const guidance = new Guidance();

    // ============================================================
    // 0. 常量 & 配置
    // ============================================================
    const HALL = {
      width: 20,   // X 轴
      depth: 15,   // Z 轴
      height: 8,   // Y 轴
    };

    // ============================================================
    // 1. 场景初始化
    // ============================================================
    const container = document.getElementById('canvas-container');

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.45;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);
    window.__renderer = renderer; // 调试钩子（像素探针/自动化截图用，只读）

    // 性能监控（FPS 统计 / HUD / 基线记录 / 自动降级信号）
    // 自动降级回调 5s 后才触发，届时 settings/applyQuality 均已就绪
    const perf = new PerfMonitor({
      renderer,
      onAutoDowngrade: () => {
        if (typeof settings === 'undefined' || !settings || settings.get('quality') === 'low') return;
        const next = settings.get('quality') === 'high' ? 'medium' : 'low';
        settings.setQuality(next, false);   // 不持久化：一次性降档，改回由用户决定
        showHints(['检测到运行帧率偏低，已自动切换为「' + (next === 'medium' ? '中' : '低') + '」画质（可在 ⚙ 设置中改回）']);
      },
    });

    // 场景
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a0a0f, 12, 35);
    scene.background = new THREE.Color(0x0a0a0f);

    // 摄像机 —— 默认俯视全局
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 60);
    camera.position.set(0, 18, 14);
    camera.lookAt(0, 1.5, 0);

    // OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.5, 0);
    // 平移改为鼠标中键（右键会触发浏览器右键手势），滚轮缩放保持不变
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.PAN,
      RIGHT: null,
    };
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 5;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.72; // 限制角度，防止翻到底部
    controls.minPolarAngle = 0.2;
    controls.update();

    // ============================================================
    // 2. 程序化纹理生成 (Canvas-based)
    // ============================================================

    /** 创建 Canvas 纹理的通用工厂 */
    function makeCanvasTexture(width, height, drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      drawFn(ctx, width, height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    /** 石质地砖纹理 */
    function drawStoneFloor(ctx, w, h) {
      ctx.fillStyle = '#4a4540';
      ctx.fillRect(0, 0, w, h);
      // 石砖线
      ctx.strokeStyle = '#3a3532';
      ctx.lineWidth = 2;
      const gs = 64;
      for (let x = 0; x < w; x += gs) { ctx.strokeRect(x, 0, gs, gs); }
      for (let y = 0; y < h; y += gs) { ctx.strokeRect(0, y, gs, gs); }
      // 随机污渍
      for (let i = 0; i < 200; i++) {
        const rx = Math.random() * w, ry = Math.random() * h;
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.15})`;
        ctx.beginPath(); ctx.arc(rx, ry, Math.random() * 8 + 2, 0, Math.PI * 2); ctx.fill();
      }
    }

    /** 精灵区藤蔓纹理 */
    function drawElfVine(ctx, w, h) {
      ctx.fillStyle = '#2a3528'; ctx.fillRect(0, 0, w, h);
      // 藤蔓线条
      for (let v = 0; v < 12; v++) {
        ctx.strokeStyle = `rgba(58,90,53,${Math.random() * 0.5 + 0.3})`;
        ctx.lineWidth = Math.random() * 5 + 1;
        ctx.beginPath();
        let x = Math.random() * w, y = 0;
        ctx.moveTo(x, y);
        while (y < h) {
          x += (Math.random() - 0.5) * 60;
          y += Math.random() * 40 + 20;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      // 符文
      ctx.fillStyle = '#c4a44a';
      ctx.font = '24px serif';
      for (let r = 0; r < 8; r++) {
        const chars = ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ', 'ᚱ', 'ᚲ', 'ᚷ', 'ᚹ', 'ᛁ', 'ᛉ'];
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)],
          Math.random() * (w - 40) + 20, Math.random() * (h - 40) + 30);
      }
    }

    /** 矮人区矿脉纹理 */
    function drawDwarfVein(ctx, w, h) {
      ctx.fillStyle = '#4a3c32'; ctx.fillRect(0, 0, w, h);
      // 矿脉
      for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = `rgba(139,90,60,${Math.random() * 0.5 + 0.5})`;
        ctx.lineWidth = Math.random() * 8 + 3;
        ctx.beginPath();
        let x = Math.random() * w, y = 0;
        ctx.moveTo(x, y);
        for (let s = 0; s < 10; s++) {
          x += (Math.random() - 0.5) * 80;
          y += h / 10;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      // 晶体亮点
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = `rgba(196,160,80,${Math.random() * 0.7 + 0.3})`;
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 4 + 1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /** 兽人区粗糙石纹 */
    function drawOrcStone(ctx, w, h) {
      ctx.fillStyle = '#3a3533'; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 400; i++) {
        const shade = Math.random() * 40 - 20;
        ctx.fillStyle = `rgba(${58 + shade},${53 + shade},${51 + shade},${Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 6 + 1, 0, Math.PI * 2);
        ctx.fill();
      }
      // 暗红斑点
      for (let i = 0; i < 15; i++) {
        ctx.fillStyle = `rgba(90,42,42,${Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 12 + 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /** 人类区灼痕圣徽纹理 */
    function drawHumanSigil(ctx, w, h) {
      ctx.fillStyle = '#c4b8a5'; ctx.fillRect(0, 0, w, h);
      // 灼烧黑斑（中心）
      const cx = w / 2, cy = h / 2;
      const burnGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 120);
      burnGrad.addColorStop(0, '#1a1210');
      burnGrad.addColorStop(0.4, '#2a1a15');
      burnGrad.addColorStop(0.7, '#3a2820');
      burnGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = burnGrad;
      ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI * 2); ctx.fill();
      // 裂隙
      ctx.strokeStyle = '#0a0505';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI * 2 / 6) * i + Math.random() * 0.3;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * 100, cy + Math.sin(angle) * 100);
        ctx.stroke();
      }
    }

    /** 浮雕符文纹理 */
    function drawReliefRunes(ctx, w, h) {
      ctx.fillStyle = '#3a3832'; ctx.fillRect(0, 0, w, h);
      // 同心圆
      ctx.strokeStyle = '#5a5850'; ctx.lineWidth = 2;
      for (let r = 40; r < w / 2; r += 36) {
        ctx.beginPath(); ctx.arc(w / 2, h / 2, r, 0, Math.PI * 2); ctx.stroke();
      }
      // 放射线
      ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        const a = (Math.PI * 2 / 12) * i;
        ctx.beginPath();
        ctx.moveTo(w / 2, h / 2);
        ctx.lineTo(w / 2 + Math.cos(a) * w / 2.4, h / 2 + Math.sin(a) * h / 2.4);
        ctx.stroke();
      }
      // 中央发光
      const glow = ctx.createRadialGradient(w / 2, h / 2, 8, w / 2, h / 2, 50);
      glow.addColorStop(0, 'rgba(200,180,120,0.6)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(w / 2, h / 2, 50, 0, Math.PI * 2); ctx.fill();
    }

    // 生成所有纹理
    const floorTex     = makeCanvasTexture(512, 512, drawStoneFloor);
    const elfTex       = makeCanvasTexture(256, 512, drawElfVine);
    const dwarfTex     = makeCanvasTexture(256, 512, drawDwarfVein);
    const orcTex       = makeCanvasTexture(256, 512, drawOrcStone);
    const humanTex     = makeCanvasTexture(256, 512, drawHumanSigil);
    const reliefTex    = makeCanvasTexture(512, 512, drawReliefRunes);

    // 设置重复
    floorTex.repeat.set(3, 2.25);
    elfTex.repeat.set(2, 1);
    dwarfTex.repeat.set(1.5, 1);
    orcTex.repeat.set(1.5, 1);
    humanTex.repeat.set(2, 1);

    // ============================================================
    // 3. HDR 环境贴图
    // ============================================================
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    // 先用中性灰色环境，HDR 加载成功后替换
    const fallbackScene = new THREE.Scene();
    fallbackScene.add(new THREE.AmbientLight(0x443830));
    scene.environment = pmremGenerator.fromScene(fallbackScene).texture;

    const rgbeLoader = new RGBELoader();
    // 本地 HDR（Old Hall 废弃大厅，CC0），离线可用且贴题
    const HDR_URL = '/old_hall.hdr';

    // ============================================================
    // 2b. 写实 PBR 材质加载（Poly Haven CC0，酒馆风格）
    // ============================================================
    const texLoader = new THREE.TextureLoader();
    // 失败时静默回退 Canvas 纹理
    const loadTex = (url) => new Promise((resolve) => {
      texLoader.load(url, (t) => {
        t.colorSpace = THREE.SRGBColorSpace;
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.RepeatWrapping;
        resolve(t);
      }, undefined, () => resolve(null));
    });

    (async () => {
      // 酒馆风格材质映射（颜色 + 法线）
      const [wallStone, wallStoneN, floorWood, floorWoodN, beamWood, beamWoodN, darkWoodTex, darkWoodN] = await Promise.all([
        loadTex('/textures/stone_wall/castle_brick_01_color.jpg'),
        loadTex('/textures/stone_wall/castle_brick_01_normal.jpg'),
        loadTex('/textures/wood_floor/brown_planks_03_color.jpg'),
        loadTex('/textures/wood_floor/brown_planks_03_normal.jpg'),
        loadTex('/textures/wood_beam/beam_wall_01_color.jpg'),
        loadTex('/textures/wood_beam/beam_wall_01_normal.jpg'),
        loadTex('/textures/wood_dark/dark_wood_color.jpg'),
        loadTex('/textures/wood_dark/dark_wood_normal.jpg'),
      ]);

      // 1) 四面墙壁统一：城堡石墙（写实石材，酒馆地牢氛围）+ 法线贴图
      if (wallStone) {
        wallStone.repeat.set(3, 1.5);
        walls.forEach((w) => {
          if (w.material.map) w.material.map.dispose();
          w.material.map = wallStone;
          if (wallStoneN) {
            w.material.normalMap = wallStoneN;
            w.material.normalScale = new THREE.Vector2(0.7, 0.7);
          }
          w.material.color = new THREE.Color(0x8a7f75);
          w.material.metalness = 0.02;
          w.material.roughness = 0.92;
          w.material.needsUpdate = true;
        });
        // 内墙装饰板（精灵区藤蔓/矮人区矿脉等 Canvas 手绘）→ 统一写实石墙
        [westElfPanel, eastElfPanel, dwarfPanel, orcPanel].forEach((panel) => {
          if (!panel) return;
          if (panel.material.map) panel.material.map.dispose();
          panel.material.map = wallStone.clone();
          if (wallStoneN) {
            panel.material.normalMap = wallStoneN;
            panel.material.normalScale = new THREE.Vector2(0.7, 0.7);
          }
          panel.material.map.needsUpdate = true;
          panel.material.color = new THREE.Color(0x8a7f75);
          panel.material.needsUpdate = true;
        });
        console.log('[纹理] 内墙装饰板 → 写实石墙');
      }


      // 3) 地板：木地板（酒馆核心氛围）+ 法线
      if (floorWood) {
        floorWood.repeat.set(6, 4.5);
        if (floorMat.map) floorMat.map.dispose();
        floorMat.map = floorWood;
        if (floorWoodN) {
          floorMat.normalMap = floorWoodN;
          floorMat.normalScale = new THREE.Vector2(0.6, 0.6);
        }
        floorMat.color = new THREE.Color(0x9a7a50);
        floorMat.roughness = 0.85;
        floorMat.needsUpdate = true;
        console.log('[纹理] 地板 → 木地板 brown_planks_03');
      }

      // 3b) 符文面板：手绘符文 → 写实深色木（暗语板）
      if (darkWoodTex && typeof westRunePanel !== 'undefined') {
        darkWoodTex.repeat.set(1.5, 1);
        if (westRunePanel.material.map) westRunePanel.material.map.dispose();
        westRunePanel.material.map = darkWoodTex;
        if (darkWoodN) {
          westRunePanel.material.normalMap = darkWoodN;
          westRunePanel.material.normalScale = new THREE.Vector2(0.5, 0.5);
        }
        westRunePanel.material.color = new THREE.Color(0x5a4a38);
        westRunePanel.material.roughness = 0.9;
        westRunePanel.material.emissive = new THREE.Color(0xffd700);
        westRunePanel.material.emissiveIntensity = 0.25;
        westRunePanel.material.needsUpdate = true;
        console.log('[纹理] 西墙符文板 → 深色木暗语板');
      }

      // 4) 木梁：墙顶一周横梁（酒馆木构架感）+ 法线
      if (beamWood) {
        beamWood.repeat.set(4, 1);
        const beamMat = new THREE.MeshStandardMaterial({
          map: beamWood,
          normalMap: beamWoodN || undefined,
          color: 0x6a4a30,
          roughness: 0.8,
          metalness: 0.05,
        });
        const beamSize = 0.35;
        const beamY = HALL.height - 0.3;
        const beams = [
          { w: HALL.width + wallThick * 2, d: beamSize, x: 0, z: -(HALL.depth / 2) - 0.1 },
          { w: HALL.width + wallThick * 2, d: beamSize, x: 0, z: (HALL.depth / 2) + 0.1 },
          { w: beamSize, d: HALL.depth, x: -(HALL.width / 2) - 0.1, z: 0 },
          { w: beamSize, d: HALL.depth, x: (HALL.width / 2) + 0.1, z: 0 },
        ];
        beams.forEach((b) => {
          const g = new THREE.BoxGeometry(b.w, beamSize, b.d);
          const m = new THREE.Mesh(g, beamMat);
          m.position.set(b.x, beamY, b.z);
          m.castShadow = true;
          scene.add(m);
        });
        console.log('[纹理] 木梁横梁已添加（墙顶一周）');
      }

      // 5) 天花板：木梁内侧木板封顶（不投阴影，避免挡天窗光束视觉）
      if (floorWood) {
        const ceilTex = floorWood.clone();
        ceilTex.repeat.set(8, 6);
        const ceilMat = new THREE.MeshStandardMaterial({
          map: ceilTex,
          color: 0x6a5a45,
          roughness: 0.9,
          metalness: 0.03,
          side: THREE.DoubleSide,
        });
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(HALL.width, HALL.depth), ceilMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = HALL.height - 0.35;
        ceiling.castShadow = false;
        ceiling.receiveShadow = false;
        scene.add(ceiling);
        // 俯瞰视角从上方看，需隐藏天花板以免挡住内部
        window.__ceilingMesh = ceiling;
        ceiling.visible = typeof fpsController !== 'undefined' && fpsController ? fpsController.mode !== 'overview' : false;
        console.log('[纹理] 天花板木板已添加');
      }

      // 6) 四角石柱：建筑支撑感 + 空间纵深
      if (wallStone) {
        const colGeo = new THREE.BoxGeometry(0.5, HALL.height - 1.0, 0.5);
        const colTex = wallStone.clone();
        colTex.repeat.set(1, 4);
        const colMat = new THREE.MeshStandardMaterial({
          map: colTex,
          normalMap: wallStoneN || undefined,
          color: 0x6a625c,
          roughness: 0.9,
          metalness: 0.05,
        });
        const halfW = HALL.width / 2 - 0.65;
        const halfD = HALL.depth / 2 - 0.65;
        const colH = (HALL.height - 1.0) / 2;
        [[-halfW, -halfD], [halfW, -halfD], [-halfW, halfD], [halfW, halfD]].forEach(([x, z]) => {
          const c = new THREE.Mesh(colGeo, colMat);
          c.position.set(x, colH, z);
          c.castShadow = true;
          c.receiveShadow = true;
          scene.add(c);
        });
        console.log('[纹理] 四角石柱已添加');
      }
    })();

    rgbeLoader.load(
      HDR_URL,
      (texture) => {
        const envMap = pmremGenerator.fromEquirectangular(texture).texture;
        scene.environment = envMap;
        texture.dispose();
        console.log('[HDR] Old Hall 环境贴图加载成功');
      },
      undefined,
      () => {
        console.warn('[HDR] 环境贴图加载失败，使用默认照明');
      }
    );

    // ============================================================
    // 4. 光照系统
    // ============================================================

    // 4a. 环境光 —— 提供最基础照明
    const ambientLight = new THREE.AmbientLight(0x4a4038, 1.25);
    scene.add(ambientLight);

    // 4b. 半球光 —— 模拟天空/地面漫反射
    const hemiLight = new THREE.HemisphereLight(0xc8b8a0, 0x3a3530, 0.75);
    scene.add(hemiLight);

    // 4c. 主方向光 —— 模拟殿顶天窗
    const sunLight = new THREE.DirectionalLight(0xffd8a0, 3.5);
    sunLight.position.set(0, 10, 0);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 30;
    sunLight.shadow.camera.left = -14;
    sunLight.shadow.camera.right = 14;
    sunLight.shadow.camera.top = 10;
    sunLight.shadow.camera.bottom = -10;
    sunLight.shadow.bias = -0.0003;
    sunLight.shadow.normalBias = 0.02;
    scene.add(sunLight);

    // 4d. 守护灵点光源（颜色随后续道德评分动态变化）
    const guardianPointLight = new THREE.PointLight(0x5cc8d8, 8, 6, 2);
    guardianPointLight.position.set(0, 3.2, 0);
    guardianPointLight.castShadow = true;
    guardianPointLight.shadow.mapSize.width = 512;
    guardianPointLight.shadow.mapSize.height = 512;
    guardianPointLight.shadow.camera.near = 0.3;
    guardianPointLight.shadow.camera.far = 20;
    guardianPointLight.shadow.bias = -0.002;
    scene.add(guardianPointLight);

    // 点光源可视化小球（光源位置指示）
    const lightBulbGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const lightBulbMat = new THREE.MeshBasicMaterial({ color: 0x5cc8d8 });
    const lightBulb = new THREE.Mesh(lightBulbGeo, lightBulbMat);
    lightBulb.position.copy(guardianPointLight.position);
    scene.add(lightBulb);

    // ============================================================
    // 火焰视觉系统（泪滴形焰 + 内芯 + 余烬粒子，火把/壁灯/烛火共用）
    // ============================================================
    function makeFlameGeo() {
      const pts = [];
      const N = 14;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        // 底窄→中宽→顶尖的泪滴剖面；Lathe 绕 Y 轴成体
        const r = Math.pow(Math.sin(t * Math.PI), 0.9) * 0.13 + (1 - t) * 0.02;
        pts.push(new THREE.Vector2(r, t * 0.55));
      }
      return new THREE.LatheGeometry(pts, 10);
    }
    const FLAME_GEO = makeFlameGeo();
    // 程序化径向渐变纹理：软光晕（球面光斑的替代，边缘柔和）
    function makeRadialTex(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.35, 'rgba(255,255,255,0.55)');
      grad.addColorStop(0.7, 'rgba(255,255,255,0.15)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    const SOFT_GLOW_TEX = makeRadialTex(64);   // 光晕
    const SOFT_DOT_TEX = makeRadialTex(16);    // 余烬圆点
    // 普通混合：火焰本体在亮墙上也能保持橙色可读（加色混合会饱和成白点）
    const FLAME_OUTER_MAT = new THREE.MeshBasicMaterial({ color: 0xff6a1f, transparent: true, opacity: 0.92, blending: THREE.NormalBlending, depthWrite: false });
    const FLAME_INNER_MAT = new THREE.MeshBasicMaterial({ color: 0xffe8b0, transparent: true, opacity: 0.95, blending: THREE.NormalBlending, depthWrite: false });
    const FLAME_EMBER_MAT = new THREE.PointsMaterial({ map: SOFT_DOT_TEX, color: 0xffc070, size: 0.06, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });

    // 建一组火焰视觉：外层焰 + 内芯 + 余烬粒子（16 粒），返回引用
    function createFlameVisual(size) {
      const group = new THREE.Group();
      const flame = new THREE.Mesh(FLAME_GEO, FLAME_OUTER_MAT);
      flame.scale.setScalar(size);
      flame.renderOrder = 1;
      group.add(flame);
      const core = new THREE.Mesh(FLAME_GEO, FLAME_INNER_MAT);
      core.scale.setScalar(size * 0.5);
      core.position.y = -0.02;
      core.renderOrder = 2;
      group.add(core);
      const emberCount = 16;
      const pos = new Float32Array(emberCount * 3);
      const seeds = new Float32Array(emberCount);
      for (let i = 0; i < emberCount; i++) seeds[i] = Math.random();
      const egeo = new THREE.BufferGeometry();
      egeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const embers = new THREE.Points(egeo, FLAME_EMBER_MAT);
      embers.renderOrder = 3;
      group.add(embers);
      return { group, flame, core, embers, emberSeed: seeds, emberCount, size };
    }

    // 余烬粒子上升（相位循环：0→1 上升摇曳，到顶回底）
    function updateEmbers(points, seeds, elapsed, seedOffset) {
      const pos = points.geometry.attributes.position.array;
      const n = seeds.length;
      for (let i = 0; i < n; i++) {
        const ph = (elapsed * 0.5 + seeds[i] + seedOffset * 0.13) % 1;
        const s = ph * Math.PI;
        pos[i * 3] = Math.sin(s * 3 + seeds[i] * 12 + elapsed * 2) * 0.08 * ph;
        pos[i * 3 + 1] = ph * 0.7;
        pos[i * 3 + 2] = Math.cos(s * 2 + seeds[i] * 8 + elapsed * 1.7) * 0.05 * ph;
      }
      points.geometry.attributes.position.needsUpdate = true;
    }

    // 统一火焰注册表（动画循环统一驱动）
    const __flames = [];
    window.__flames = __flames;

    // 4e. 壁灯暖光（南北墙，无阴影，酒馆烛光感）
    const sconceLights = [];
    const sconceFlames = [];
    const sconceGlows = [];
    [-5.2, 5.2].forEach((x) => {
      [-6.4, 6.4].forEach((z) => {
        const s = new THREE.PointLight(0xffa860, 5.5, 8, 1.8);
        s.position.set(x, 3.3, z);
        s.castShadow = false;
        scene.add(s);
        sconceLights.push(s);
        // 木质灯座
        const mount = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.1, 0.35, 8),
          new THREE.MeshStandardMaterial({ color: 0x4a3420, roughness: 0.85 })
        );
        mount.position.set(x, 3.3 - 0.26, z);
        scene.add(mount);
        // 金属灯杯
        const cup = new THREE.Mesh(
          new THREE.CylinderGeometry(0.09, 0.07, 0.12, 10),
          new THREE.MeshStandardMaterial({ color: 0x5a5048, roughness: 0.5, metalness: 0.7 })
        );
        cup.position.set(x, 3.3 - 0.05, z);
        scene.add(cup);
        // 泪滴形火焰（外层焰 + 内芯 + 余烬粒子）
        const vis = createFlameVisual(0.4);
        vis.group.position.set(x, 3.28, z);
        scene.add(vis.group);
        // 光晕（径向渐变 Sprite，边缘柔和；深度写关避免雾化遮挡）
        const gl = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: SOFT_GLOW_TEX, color: 0xff9a40, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        gl.position.set(x, 3.35, z);
        gl.scale.set(1.7, 1.7, 1);
        gl.renderOrder = 0; // 光晕在火焰下层，避免加色冲掉橙色焰体
        scene.add(gl);
        sconceGlows.push(gl);
        // 注册统一火焰动画（画质门控：低档熄灭全部壁灯）
        __flames.push({
          isSconce: true, ...vis, light: s, lightBase: 5.5, glow: gl, glowBase: 0.5,
        });
        sconceFlames.push(vis.flame);
      });
    });
    // 供动画循环引用（火焰闪烁 + 光源强度抖动）
    window.__sconceLights = sconceLights;
    window.__sconceFlames = sconceFlames;
    window.__sconceGlows = sconceGlows;

    // ============================================================
    // 5. 大殿结构：地面 + 墙壁 + 区域标记
    // ============================================================

    // --- 5a. 地面 ---
    const floorGeo = new THREE.PlaneGeometry(HALL.width, HALL.depth);
    const floorMat = new THREE.MeshStandardMaterial({
      map: floorTex,
      roughness: 0.85,
      metalness: 0.05,
      color: 0x888078,
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    // --- 5b. 四面墙壁 ---
    const wallThick = 0.4;
    const wallHeight = HALL.height;
    const wallY = wallHeight / 2;

    function createWall(width, height, depth, x, y, z, texture, colorHex, roughVal) {
      const geo = new THREE.BoxGeometry(width, height, depth);
      const mat = new THREE.MeshStandardMaterial({
        map: texture || undefined,
        color: colorHex ? new THREE.Color(colorHex) : undefined,
        roughness: roughVal !== undefined ? roughVal : 0.75,
        metalness: 0.05,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    // 收集四面墙（真实纹理异步替换用）
    const walls = [];

    // 北墙（入口 — 封死）
    walls.push(createWall(HALL.width + wallThick * 2, wallHeight, wallThick,
      0, wallY, -(HALL.depth / 2 + wallThick / 2),
      null, 0x3a3532, 0.8));

    // 南墙（人类区侧）
    walls.push(createWall(HALL.width + wallThick * 2, wallHeight, wallThick,
      0, wallY, (HALL.depth / 2 + wallThick / 2),
      humanTex, 0xc4b8a5, 0.7));

    // 西墙（精灵 + 矮人侧）
    walls.push(createWall(wallThick, wallHeight, HALL.depth,
      -(HALL.width / 2 + wallThick / 2), wallY, 0,
      null, 0x3d3834, 0.78));

    // 东墙（精灵 + 兽人侧）
    walls.push(createWall(wallThick, wallHeight, HALL.depth,
      (HALL.width / 2 + wallThick / 2), wallY, 0,
      null, 0x3d3834, 0.78));

    // --- 5c. 内墙装饰板（区域特征） ---

    /** 创建贴在内墙面的装饰板 */
    function createWallPanel(width, height, x, y, z, rotY, texture) {
      const geo = new THREE.PlaneGeometry(width, height);
      const mat = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.65,
        metalness: 0.08,
      });
      const panel = new THREE.Mesh(geo, mat);
      panel.position.set(x, y, z);
      panel.rotation.y = rotY || 0;
      panel.receiveShadow = true;
      scene.add(panel);
      return panel;
    }

    // 精灵区西墙内板（保存引用，用于后续发光控制）
    // 注意：PlaneGeometry 默认在 XY 平面（法线 +Z），要贴到东西墙（YZ 平面）必须绕 Y 转 ±90°，
    // 否则会变成悬浮在殿中央的恒定-Z 竖直面，挡住火把/视线。
    const westElfPanel = createWallPanel(6, 5, -(HALL.width / 2) + 0.21, 2.5, -3.75, Math.PI / 2, elfTex);
    // 精灵区东墙内板
    const eastElfPanel = createWallPanel(6, 5, (HALL.width / 2) - 0.21, 2.5, -3.75, -Math.PI / 2, elfTex);
    // 矮人区西墙内板
    const dwarfPanel = createWallPanel(5, 4, -(HALL.width / 2) + 0.21, 2, 4.25, Math.PI / 2, dwarfTex);
    // 兽人区东墙内板
    const orcPanel = createWallPanel(5, 4, (HALL.width / 2) - 0.21, 2, 4.25, -Math.PI / 2, orcTex);

    // --- 符文面板（西墙上部，独立 emissive 控制）---
    const westRunePanel = createWallPanel(5, 2.5, -(HALL.width / 2) + 0.22, 6.25, -3.75, Math.PI / 2, reliefTex);
    westRunePanel.material.emissive = new THREE.Color(0xc8b478);
    westRunePanel.material.emissiveIntensity = 0.7;
    // westRunePanel 引用保留，供按键 Q/E 调节发光强度

    // --- 5d. 地面区域标记 ---
    function createZoneMarker(w, d, x, z, colorHex, tex, emissiveHex, emissiveIntensity) {
      const geo = new THREE.PlaneGeometry(w, d);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(colorHex),
        map: tex || undefined,
        roughness: 0.6,
        metalness: 0.05,
        emissive: emissiveHex ? new THREE.Color(emissiveHex) : undefined,
        emissiveIntensity: emissiveIntensity || 0,
        transparent: true,
        opacity: 0.35,
      });
      const marker = new THREE.Mesh(geo, mat);
      marker.rotation.x = -Math.PI / 2;
      marker.position.set(x, 0.015, z);
      marker.receiveShadow = true;
      scene.add(marker);
      return marker;
    }

    /**
     * 组装一个简易人形 NPC（躯干 box + 头部 sphere + 四肢 cylinder）
     */
    function createHumanoidGroup(cfg) {
      const group = new THREE.Group();
      group.position.set(cfg.x, cfg.y, cfg.z);

      const bp = NPC_BODY_PARAMS[cfg.label];
      const legH   = bp.h * 0.38;   // 腿长
      const armH   = bp.h * 0.48;   // 臂长
      const limbR  = bp.w * 0.10;   // 肢体半径

      // --- 躯干 ---
      const torsoGeo = new THREE.BoxGeometry(bp.w, bp.h, bp.d);
      const torsoMat = new THREE.MeshStandardMaterial({
        color: cfg.color,
        roughness: 0.5,
        metalness: 0.3,
        emissive: cfg.color,
        emissiveIntensity: 0.1,
      });
      const torso = new THREE.Mesh(torsoGeo, torsoMat);
      torso.position.y = legH + bp.h / 2;
      torso.castShadow = true;
      torso.receiveShadow = true;
      torso.name = 'torso';
      group.add(torso);

      // --- 头部 ---
      const headGeo = new THREE.SphereGeometry(bp.headR, 16, 12);
      const headMat = new THREE.MeshStandardMaterial({
        color: cfg.color,
        roughness: 0.45,
        metalness: 0.25,
      });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = legH + bp.h + bp.headR * 0.5;
      head.castShadow = true;
      head.name = 'head';
      group.add(head);

      // --- 左臂 ---
      const armGeo = new THREE.CylinderGeometry(limbR, limbR * 0.65, armH, 8);
      const armMat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.5, metalness: 0.3 });
      const leftArm = new THREE.Mesh(armGeo, armMat);
      leftArm.position.set(-(bp.w / 2 + limbR * 0.2), legH + bp.h * 0.55, 0);
      leftArm.rotation.z = 0.15;
      leftArm.castShadow = true;
      leftArm.name = 'leftArm';
      group.add(leftArm);

      // --- 右臂 ---
      const rightArm = new THREE.Mesh(armGeo, armMat.clone());
      rightArm.position.set(bp.w / 2 + limbR * 0.2, legH + bp.h * 0.55, 0);
      rightArm.rotation.z = -0.15;
      rightArm.castShadow = true;
      rightArm.name = 'rightArm';
      group.add(rightArm);

      // --- 左腿 ---
      const legGeo = new THREE.CylinderGeometry(limbR * 1.2, limbR * 0.85, legH, 8);
      const legMat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.55, metalness: 0.25 });
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-bp.w * 0.20, legH / 2, 0);
      leftLeg.castShadow = true;
      leftLeg.name = 'leftLeg';
      group.add(leftLeg);

      // --- 右腿 ---
      const rightLeg = new THREE.Mesh(legGeo, legMat.clone());
      rightLeg.position.set(bp.w * 0.20, legH / 2, 0);
      rightLeg.castShadow = true;
      rightLeg.name = 'rightLeg';
      group.add(rightLeg);

      // --- 底座 ---
      const baseR = Math.max(bp.w * 0.45, 0.28);
      const baseGeo = new THREE.CylinderGeometry(baseR, baseR + 0.02, 0.08, 16);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x554f48, roughness: 0.7, metalness: 0.4 });

      base.position.y = 0.04;

    /**
     * 用加载好的 Mixamo 模型替换几何人形（位置/朝向/注册表无缝交接）
     */
    function replaceNpcWithModel(npcKey, model) {
      const entry = npcMeshes[npcKey];
      if (!entry) return;

      // 继承几何人形的世界位置（X/Z），Y 由模型归一化已对齐地面
      model.position.x = entry.group.position.x;
      model.position.z = entry.group.position.z;
      model.userData.baseColor = entry.cfg.color;

      scene.add(model);
      scene.remove(entry.group);

      // 释放几何人形资源
      entry.group.traverse((child) => {
        if (child.isMesh) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
      });

      // 注册表换用模型（后续 lerp / 标签 / 情绪 / 信任度都走模型）
      entry.group = model;
      entry.modelLoaded = true;

      // ???????????? >= ???????
      const enterStage = NPC_ENTRANCE_STAGE[npcKey] || 99;
      entry.group.visible = (window.__forceNpcVisible === true) || currentPhase >= enterStage;

      // 同步当前信任度表现
      modelManager.setTrust(npcKey, npcTrust[npcKey] !== undefined ? npcTrust[npcKey] : 0.5);
      console.log('[模型] ' + npcKey + ' 已替换几何人形');
    }

    /**
     * 根据情绪更新 NPC 躯干 emissive
     * @param {string} npcKey - NPC 标识
     * @param {string} mood   - 情绪: 'angry'|'vulnerable'|'hopeful'|'tense'|'default'
     */
    function updateNPCAppearance(npcKey, mood) {
      const entry = npcMeshes[npcKey];
      if (!entry) return;
      // 已加载模型：情绪通过模型发光表现
      if (entry.modelLoaded) {
        modelManager.setMood(npcKey, mood);
        return;
      }
      const ud = entry.group.userData;
      ud.mood = mood;

      entry.group.children.forEach((child) => {
        if (child.name !== 'torso' || !child.material.emissive) return;

        switch (mood) {
          case 'angry':
            child.material.emissive.set(0xff2020);
            child.material.emissiveIntensity = 0.5;
            break;
          case 'vulnerable':
            child.material.emissive.set(0x4060ff);
            child.material.emissiveIntensity = 0.3;
            break;
          case 'hopeful':
            child.material.emissive.set(0xffd700);
            child.material.emissiveIntensity = 0.4;
            break;
          case 'tense':
            ud.tenseTimer = 0;
            child.material.emissive.set(0xff8888);
            child.material.emissiveIntensity = 0.15;
            break;
          default:
            child.material.emissive.set(ud.baseColor);
            child.material.emissiveIntensity = 0.1;
            break;
        }
      });
    }

    /**

     */
    function createEmotionParticles(npcKey, emotion) {
      const entry = npcMeshes[npcKey];
      if (!entry) return;

      const color = EMOTION_COLORS[emotion] || 0xffffff;
      const count = 3 + Math.floor(Math.random() * 3); // 3~5 颗

      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const velocities = [];

      const px = entry.group.position.x;
      const py = entry.group.position.y + 1.1;
      const pz = entry.group.position.z;

      for (let i = 0; i < count; i++) {
        positions[i * 3]     = px + (Math.random() - 0.5) * 0.5;
        positions[i * 3 + 1] = py + Math.random() * 0.3;
        positions[i * 3 + 2] = pz + (Math.random() - 0.5) * 0.5;
        velocities.push({
          x: (Math.random() - 0.5) * 0.7,
          y: Math.random() * 0.5 + 0.3,
          z: (Math.random() - 0.5) * 0.7,
        });
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const mat = new THREE.PointsMaterial({
        color,
        size: 0.07,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const particles = new THREE.Points(geo, mat);
      particles.userData = { velocities, life: 2.0, age: 0, count };
      scene.add(particles);

      // 加入全局数组，动画循环中统一管理
      if (!scene.userData._emotionParticles) scene.userData._emotionParticles = [];
      scene.userData._emotionParticles.push(particles);
    }

    function buildTavernProps() {
      const T = THREE;

        barrel.position.set(x, 0.45, z);
        barrel.castShadow = true;
        barrel.receiveShadow = true;
        scene.add(barrel);
        props.push(barrel);

      // 火把（4 支，墙柱上）—— 动态火焰光

      torchPos.forEach(({ x, z }, i) => {
        const torch = new T.Group();
        const handle = new T.Mesh(new T.CylinderGeometry(0.04, 0.05, 0.8, 8), darkWoodMat);
        handle.position.y = 1.4;
        torch.add(handle);
        // 金属灯杯（取代球头）
        const head = new T.Mesh(new T.CylinderGeometry(0.09, 0.06, 0.14, 8), metalMat);
        head.position.y = 1.85;
        torch.add(head);
        // 壁挂支架：金属横臂 + 墙面玫瑰固定盘（把火把锚定到壁画墙，远处不再像悬浮）
        const dirX = x > 0 ? 1 : -1;
        const panelX = dirX * (HALL.width / 2 - 0.21);   // 壁画面板表面 x≈±9.79（比砖墙内壁 x=±10 靠内 0.21）
        const armLen = Math.abs(panelX - x);              // 臂长 ~1.29，末端正好顶到壁画面

        // 注意：这些是火把组的【本地】坐标（火把组自身位于世界 (x,0,z)），必须减去 (x,z)！
        bracket.position.set((x + panelX) / 2 - x, armY, 0);
        torch.add(bracket);
        // 玫瑰固定盘（短圆柱盘，面朝大殿，紧贴壁画面上）

        glow.position.y = 2.1;
        glow.scale.set(2.4, 2.4, 1);

        torch.add(glow);
        // 点光源

        light.position.y = 2.2;
        torch.add(light);

    function updateNpcVisuals() {
      Object.entries(npcMeshes).forEach(([key, { group, cfg, modelLoaded }]) => {
        const trust = npcTrust[key] !== undefined ? npcTrust[key] : 0.5;
        // 已加载模型：信任度通过模型发光表现，不染色贴图
        if (modelLoaded) {
          modelManager.setTrust(key, trust);
          return;
        }
        const brightness = 0.35 + trust * 1.15; // 0→0.35, 0.5→0.925, 1→1.5
        const baseColor = new THREE.Color(cfg.color);
        const hsl = {};
        baseColor.getHSL(hsl);
        const adjusted = new THREE.Color();
        adjusted.setHSL(hsl.h, hsl.s, Math.min(1, Math.max(0.1, hsl.l * brightness)));

        group.traverse((child) => {
          if (child.isMesh && child.material.color && child.material.roughness !== undefined && child.material.roughness < 0.7) {
            child.material.color.copy(adjusted);
          }
        });
      });
    }

          const nameColor = npcInfo ? '#' + npcInfo.color.toString(16).padStart(6, '0') : '#d8d0c0';

          div.innerHTML = '<span class="npc-name" style="color:' + nameColor + '">' + escapeHtml(displayName) + '</span><br>' + escapeHtml(msg.text);

          const npcInfo = npcPositions[msg.npc];

          const npcBg = npcInfo ? npcHexToRgba(npcInfo.color, 0.15) : 'rgba(212, 168, 67, 0.15)';
          const displayName = npcInfo ? npcInfo.displayName : (msg.npc || '???');
          div.style.borderLeftColor = npcColor;

      isChatLoading = true;

      // 对话目标解析（用于日志；说话动画改为收到 NPC 回复时触发）

      // 添加玩家消息到历史
      const playerMsg = { type: 'player', text: message.trim() };
      if (chatMode === 'whisper' && whisperTarget) {
        const npcInfo = npcPositions[whisperTarget];
        playerMsg.text = '[悄悄话 @' + (npcInfo ? npcInfo.displayName : whisperTarget) + '] ' + message.trim();

      // 构建请求体
      const body = {
        message: message.trim(),
        mode: chatMode,
        target: chatMode === 'whisper' ? whisperTarget : chatTarget,
        phase: currentPhase,
      };

      try {
        const resp = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: AbortSignal.timeout(30000),
        });

        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        serverConnected = true;
        processChatResponse(data);
      } catch (e) {
        console.warn('[API] 服务器通信失败，使用本地模拟:', e.message);
        if (!serverConnected && serverCheckDone) {
          addChatMessage({ type: 'system', text: '⚠️ 服务器未连接，使用本地模拟回复' });
        }
        serverConnected = false;
        processMockResponse(message);
      } finally {
        isChatLoading = false;
        chatInput.classList.remove('loading');
        chatSendIndicator.classList.remove('visible');
        chatInput.focus();
      }
    }

    /** 处理服务器返回的对话响应 */
    function processChatResponse(data) {
      // 更新道德评分（兼容 guardian_score 新格式 / moral_score 旧格式）
      const score = data.guardian_score !== undefined ? data.guardian_score : data.moral_score;
      if (score !== undefined) {
        moralScore = Math.max(-100, Math.min(100, score));
        useApiScore = true;
      }

      // 更新 NPC 信任度（兼容 npc_states 新格式 / npc_trust 旧格式）
      const trustMap = data.npc_states || data.npc_trust;
      if (trustMap) {
        Object.entries(trustMap).forEach(([key, val]) => {
          const t = (typeof val === 'object' && val !== null) ? val.trust : val;
          if (npcTrust[key] !== undefined && t !== undefined) {
            npcTrust[key] = Math.max(0, Math.min(1, (t + 100) / 200));
          }
        });
        updateNpcVisuals();
      }

      // 处理回复：兼容 reply 单条（新格式）与 replies 数组（旧格式）
      if (data.reply) {
        // 动画与显示统一用 npc_id（如 'baruk'）；npc_name 是中文显示名，不能当模型键
        const replyNpc = data.npc_id || data.npc_name || '';
        addChatMessage({
          type: 'npc',
          npc: replyNpc,
          text: data.reply,
          isFauxPas: data.slip_occurred || false,
        });
        // 收到回复时播放说话动画（玩家看到 NPC 开口）
        if (replyNpc && replyNpc !== 'guardian') {
          modelManager.playTalk(replyNpc);
        }
      }
      if (data.replies && Array.isArray(data.replies)) {
        let firstSpeaker = null;
        data.replies.forEach((reply) => {
          addChatMessage({
            type: reply.type || 'npc',
            npc: reply.npc,
            text: reply.text,
            isFauxPas: reply.is_faux_pas || false,
          });
          if (!firstSpeaker && (reply.type || 'npc') === 'npc' && reply.npc && reply.npc !== 'guardian') {
            firstSpeaker = reply.npc;
          }
        });
        if (firstSpeaker) modelManager.playTalk(firstSpeaker);
      }

      // 检查结局（ID → 可读名称）
      if (data.ending) {
        const ENDING_NAMES = {
          truth_temple: '真理之殿',
          blood_debt: '血债血偿',
          new_flame: '新火种',
          no_redemption: '谁都没被救赎',
          godslayer: '弑神者',
        };
        addChatMessage({
          type: 'system',
          text: '【结局触发】' + (ENDING_NAMES[data.ending] || data.ending),
        });
      }

      // 更新阶段
      if (data.phase !== undefined) {
        currentPhase = data.phase;
        updatePhaseButton();
      }

      // === 可视线索 === 每次对话后刷新感知提示条
      if (data.hints) {
        showHints(data.hints);
      }

      // === NPC 微反应 === 插入连锁反应插话卡片
      if (data.event_chain && Array.isArray(data.event_chain)) {
        data.event_chain.forEach(function(link) {
          if (!link || !link.npc) return;
          addChatMessage({
            type: 'interjection',
            npc: link.npc,
            text: (link.interjection || '……'),
          });
        });
      }

      // === 悄悄话交易 === 展示交易结果横幅
      if (data.whisper && typeof data.whisper === 'object' && data.whisper.deal_accepted !== undefined) {
        showTradeBanner(!!data.whisper.deal_accepted);
      }

      // === 出场节奏 === 充分对话后温和提示可推进（控制权在玩家手中）
      if (data.pacing_hint) {
        addChatMessage({ type: 'system', text: data.pacing_hint });
        // 让推进按钮闪烁提醒
        phaseAdvanceBtn.classList.add('attention');
        setTimeout(function() { phaseAdvanceBtn.classList.remove('attention'); }, 6000);
      }

      // 新增：对话后同步关系网数据（/api/state）
      fetchGameState();
    }

    /** 本地模拟回复（服务器未连接时的回退） */
    function processMockResponse(message) {
      const mockPool = [
        { type: 'npc', npc: 'liana',    text: '（莉安娜若有所思地看着你）"这个问题……我也在寻找答案。"' },
        { type: 'npc', npc: 'baruk',    text: '（巴鲁克哼了一声，手指敲了敲墙壁）"石头不说话。"' },
        { type: 'npc', npc: 'margaret', text: '（玛格丽特沉默片刻，目光移向远方）"有些事，不说比较好。"' },
        { type: 'npc', npc: 'rog',      text: '（罗格握紧拳头，又缓缓松开）"……这不是你该问的。"' },
        { type: 'system', text: '*大殿中回荡着微弱的回音。墙壁上的符文似乎在注视着这一切。*' },
        { type: 'npc', npc: 'guardian', text: '（守护灵的光芒微弱地闪烁了一下，没有回应）' },
      ];
      // 随机选择 1~2 条回复
      const count = Math.random() > 0.5 ? 2 : 1;
      const shuffled = [...mockPool].sort(() => Math.random() - 0.5);
      for (let i = 0; i < count; i++) {
        addChatMessage(shuffled[i]);
        if (i === 0 && shuffled[i].type === 'npc' && shuffled[i].npc && shuffled[i].npc !== 'guardian') {
          modelManager.playTalk(shuffled[i].npc);
        }
      }
      // 模拟道德评分微小变化
      moralScore += (Math.random() - 0.5) * 6;
      moralScore = Math.max(-100, Math.min(100, moralScore));
      useApiScore = true;
    }

    /** 推进阶段 */
    async function advancePhase() {
      try {
        const resp = await fetch(API_BASE + '/api/advance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phase: currentPhase }),
          signal: AbortSignal.timeout(10000),
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        serverConnected = true;

        // 阶段号兼容：stage（新格式）/ phase（旧格式）
        if (data.stage !== undefined) {
          currentPhase = data.stage;
        } else if (data.phase !== undefined) {
          currentPhase = data.phase;
        }
        guidance.setStage(currentPhase);

        // === ??????????? NPC ???????? ===
        const enterNpc = STAGE_ENTRANCE_NPC[currentPhase];
        if (enterNpc && npcMeshes[enterNpc]) {
          const e2 = npcMeshes[enterNpc];
          e2.group.visible = true;
          e2.group.position.set(ENTRANCE_POS.x, 0, ENTRANCE_POS.z);
          npcWanderState[enterNpc] = npcWanderState[enterNpc] || {};
          npcWanderState[enterNpc].target = new THREE.Vector3(npcPositions[enterNpc].x, 0, npcPositions[enterNpc].z);
          npcWanderState[enterNpc].entering = true;
          npcWanderState[enterNpc].timer = 999;
        }

        if (data.npc_name && data.entrance_line) {
          // 新 NPC 入场演出
          addChatMessage({ type: 'system', text: '—— 门被推开了 ——' });
          addChatMessage({ type: 'npc', npc: data.npc_name, text: data.entrance_line });
          // 入场台词 → 说话动画（模型未加载则挂起，加载后补播）
          if (data.new_npc && data.new_npc !== 'guardian') {
            modelManager.playTalk(data.new_npc);
          }
          if (data.description) {
            addChatMessage({ type: 'system', text: data.description });
          }
          // 对话目标自动切到新入场 NPC
          if (data.new_npc && data.new_npc !== 'guardian') {
            chatTarget = data.new_npc;
            guidance.showNpcIntro(data.new_npc);
            document.querySelectorAll('.npc-label').forEach(function(l) {
              l.classList.remove('active-talk');
            });
            const nl = document.querySelector('.npc-label.' + data.new_npc);
            if (nl) nl.classList.add('active-talk');
          }
        } else if (data.message) {
          // 所有角色已到场等情况
          addChatMessage({ type: 'system', text: data.message });
        } else {
          addChatMessage({ type: 'system', text: '阶段推进至 ' + currentPhase });
        }
        updatePhaseButton();

        // 新增：阶段推进后同步关系网数据（/api/state）
        fetchGameState();
      } catch (e) {
        console.warn('[API] 阶段推进失败:', e.message);
        addChatMessage({ type: 'system', text: '⚠️ 无法连接服务器推进阶段' });
      }
    }

        phaseAdvanceBtn.disabled = false;

      if (mode === 'public') {
        whisperTarget = null;
        isSelectingTarget = false;

    // ============================================================
    // 新增：服务器连接检测
    // ============================================================
    (function() {
      checkServerConnection().then(function(connected) {
        serverCheckDone = true;
        if (connected) {
          console.log('[API] 服务器已连接: ' + API_BASE);
          addChatMessage({ type: 'system', text: '已连接到封印之殿的灵脉……' });

    // ============================================================
    // 新增：关系网可视化悬浮面板（V 键切换）
    // ============================================================

    // --- 面板 DOM 引用 ---
    const relationshipPanelEl = document.getElementById('relationship-panel');
    const relationshipCanvasEl = document.getElementById('relationship-canvas');
    const relCtx = relationshipCanvasEl.getContext('2d');

    // 画布逻辑尺寸（与 HTML/CSS 保持一致）
    const REL_W = 460;
    const REL_H = 420;
    const REL_NODE_R = 26;     // 节点半径
    const REL_EDGE_BEND = 18;  // 双向连线的弯曲偏移量（px）

    // --- 节点定义（星形布局：守护灵居中，4 NPC 均匀分布在四周） ---
    const REL_NODES = [
      { key: 'liana',    name: '莉安娜',   abbr: '莉', x: 230, y: 62,  color: '#6fbf6f' },
      { key: 'baruk',    name: '巴鲁克',   abbr: '巴', x: 84,  y: 196, color: '#d4a843' },
      { key: 'margaret', name: '玛格丽特', abbr: '玛', x: 230, y: 330, color: '#e8e0d8' },
      { key: 'rog',      name: '罗格',     abbr: '罗', x: 376, y: 196, color: '#c4544a' },
      { key: 'guardian', name: '守护灵',   abbr: '灵', x: 230, y: 196, color: '#5cc8d8' },
    ];
    const REL_NODE_MAP = Object.fromEntries(REL_NODES.map((n) => [n.key, n]));

    // --- 态度数据（-100 ~ +100）：source → target ---
    // 数据源：/api/state 返回的 npc.attitudes；
    // 无真实数据时使用 game_data.py 中的初始态度值。
    const relAttitudes = {
      liana:    { baruk: -20, margaret: 10, rog: -10 },
      baruk:    { liana: -30, margaret: -15, rog: 25 },
      margaret: { liana: 5, baruk: -10, rog: -15 },
      rog:      { liana: 5, baruk: 25, margaret: 0 },
      guardian: { liana: 15, baruk: -10, margaret: -35, rog: 25 },
    };

    // 当前悬停的节点 key（微交互高亮）
    let relHoveredKey = null;

    // 设置画布高分屏缩放（保证文字清晰）
    (function setupRelCanvas() {
      if (!relCtx) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      relationshipCanvasEl.width = REL_W * dpr;
      relationshipCanvasEl.height = REL_H * dpr;
      relationshipCanvasEl.style.width = REL_W + 'px';
      relationshipCanvasEl.style.height = REL_H + 'px';
      relCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    })();

    /** 态度值 → 连线颜色 */
    function relEdgeColor(v) {
      if (v > 30)  return '#3fae5a';  // 绿：明显好感
      if (v >= 10) return '#d9b441';  // 黄：温和好感
      if (v > -10) return '#8a8a86';  // 灰：中立
      if (v >= -30) return '#cf7a34'; // 橙：反感
      return '#c44a4a';               // 红：强烈敌对
    }

    /**
     * 绘制一条有向连线（含箭头与数值标注）。
     * 箭头指向被态度对象：src → dst 表示 src 对 dst 的态度。
     * mode: 'full'（高亮）| 'normal'（默认）| 'dim'（弱化）
     */
    function drawRelEdge(ctx, src, dst, value, mode) {
      const x1 = src.x, y1 = src.y;
      const x2 = dst.x, y2 = dst.y;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;

      // 双向态度时向两侧弯曲，避免两条连线重叠
      const bend = (src.key < dst.key ? 1 : -1) * REL_EDGE_BEND;
      const cx = (x1 + x2) / 2 + nx * bend;
      const cy = (y1 + y2) / 2 + ny * bend;

      const color = relEdgeColor(value);
      const thickness = 1 + (Math.min(Math.abs(value), 100) / 100) * 4.5; // 越极端越粗
      const alpha = mode === 'full' ? 1.0 : mode === 'dim' ? 0.18 : 0.75;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = thickness;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, x2, y2);
      ctx.stroke();

      // 箭头：终点附近曲线的切线方向 ≈ (x2 - cx, y2 - cy)
      const tx = x2 - cx, ty = y2 - cy;
      const tl = Math.hypot(tx, ty) || 1;
      const ux = tx / tl, uy = ty / tl;

      const arrowLen = 11;
      const halfW = 4.5;
      const ax = x2 - ux * (REL_NODE_R + 2);   // 箭头尖端停在节点边缘外
      const ay = y2 - uy * (REL_NODE_R + 2);
      const bx = ax - ux * arrowLen;
      const by = ay - uy * arrowLen;
      const px = -uy, py = ux;

      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx + px * halfW, by + py * halfW);
      ctx.lineTo(bx - px * halfW, by - py * halfW);
      ctx.closePath();
      ctx.fill();

      // 连线中间标注态度数值（放在曲线顶点上方）
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.font = '10px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(String(value), cx, cy - 4);
      ctx.restore();
    }

    /** 绘制关系网面板 */
    function drawRelationshipPanel() {
      if (!relCtx) return;
      const ctx = relCtx;
      ctx.clearRect(0, 0, REL_W, REL_H);

      // 1) 先绘制所有连线（态度是有向的，双向态度分别绘制）
      Object.entries(relAttitudes).forEach(([srcKey, targets]) => {
        const src = REL_NODE_MAP[srcKey];
        if (!src) return;
        Object.entries(targets).forEach(([dstKey, value]) => {
          const dst = REL_NODE_MAP[dstKey];
          if (!dst || dstKey === srcKey) return;
          let mode;
          if (relHoveredKey) {
            mode = (srcKey === relHoveredKey || dstKey === relHoveredKey) ? 'full' : 'dim';
          } else {
            mode = 'normal';
          }
          drawRelEdge(ctx, src, dst, value, mode);
        });
      });

      // 2) 再绘制节点（覆盖连线端点，保证节点在上层）
      REL_NODES.forEach((node) => {
        const hovered = relHoveredKey === node.key;
        ctx.save();
        // 外圈光晕
        ctx.shadowColor = node.color;
        ctx.shadowBlur = hovered ? 20 : 8;
        ctx.fillStyle = 'rgba(15, 13, 10, 0.92)';
        ctx.beginPath();
        ctx.arc(node.x, node.y, REL_NODE_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // 描边
        ctx.strokeStyle = node.color;
        ctx.lineWidth = hovered ? 3 : 2;
        ctx.beginPath();
        ctx.arc(node.x, node.y, REL_NODE_R, 0, Math.PI * 2);
        ctx.stroke();
        // 中心首字
        ctx.fillStyle = node.color;
        ctx.font = 'bold 15px "Noto Serif SC", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(node.abbr, node.x, node.y);
        ctx.restore();

        // 完整名称小字（节点下方）
        ctx.save();
        ctx.fillStyle = hovered ? '#e8dcc8' : 'rgba(200, 190, 170, 0.78)';
        ctx.font = '11px "Noto Serif SC", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(node.name, node.x, node.y + REL_NODE_R + 5);
        ctx.restore();
      });
    }

    /** 切换关系网面板显隐（V 键） */
    function toggleRelationshipPanel() {
      const showing = relationshipPanelEl.classList.toggle('visible');
      if (showing) drawRelationshipPanel();
    }

    // --- 微交互：悬停节点高亮其全部连线 ---
    relationshipCanvasEl.addEventListener('mousemove', (e) => {
      const rect = relationshipCanvasEl.getBoundingClientRect();
      const scaleX = REL_W / (rect.width || 1);
      const scaleY = REL_H / (rect.height || 1);
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      let hitKey = null;
      for (const node of REL_NODES) {
        if (Math.hypot(mx - node.x, my - node.y) <= REL_NODE_R) {
          hitKey = node.key;
          break;
        }
      }
      if (hitKey !== relHoveredKey) {
        relHoveredKey = hitKey;
        drawRelationshipPanel();
      }
    });
    relationshipCanvasEl.addEventListener('mouseleave', () => {
      if (relHoveredKey !== null) {
        relHoveredKey = null;
        drawRelationshipPanel();
      }
    });

    /** 从 /api/state 响应更新态度数据（无真实数据时保留初始值） */
    function updateRelAttitudesFromState(data) {
      if (!data || !data.npcs) return;
      let changed = false;
      Object.entries(data.npcs).forEach(([npcKey, npcState]) => {
        if (!npcState || !npcState.attitudes) return;
        if (!relAttitudes[npcKey]) relAttitudes[npcKey] = {};
        Object.entries(npcState.attitudes).forEach(([targetKey, rawVal]) => {
          if (targetKey === npcKey) return; // 忽略指向自身
          const v = Math.max(-100, Math.min(100, Math.round(rawVal)));
          if (relAttitudes[npcKey][targetKey] !== v) {
            relAttitudes[npcKey][targetKey] = v;
            changed = true;
          }
        });
      });
      // 面板可见时才重绘
      if (changed && relationshipPanelEl.classList.contains('visible')) {
        drawRelationshipPanel();
      }
    }

    /** 拉取一次完整游戏状态（/api/state） */
    async function fetchGameState() {
      try {
        const resp = await fetch(API_BASE + '/api/state', {
          signal: AbortSignal.timeout(5000),
        });
        if (!resp.ok) return;
        const data = await resp.json();
        updateRelAttitudesFromState(data);
        // 同步阶段号：刷新页面后恢复推进按钮状态
        if (data.game && typeof data.game.current_stage === 'number') {
          if (data.game.current_stage !== currentPhase) {
            currentPhase = data.game.current_stage;
            updatePhaseButton();
            guidance.setStage(currentPhase);
            // ?? NPC ???????????????? NPC ????????
            for (const nk of Object.keys(NPC_ENTRANCE_STAGE)) {
              if (npcMeshes[nk] && npcMeshes[nk].group) {
                npcMeshes[nk].group.visible = (window.__forceNpcVisible === true) || currentPhase >= NPC_ENTRANCE_STAGE[nk];
              }
            }
          }
        }
      } catch (e) {
        // 服务器不可用：静默，关系网继续使用初始值
      }
    }

    // 每 4 秒拉取一次 /api/state，有更新时自动重绘
    setInterval(fetchGameState, 4000);
    fetchGameState(); // 首次拉取

    // ============================================================
    // 10. NPC 标签系统（CSS overlay 跟随 3D 坐标）
    // ============================================================
    const labelEls = {

    // --- NPC 标签点击：悄悄话选目标 / 公共模式选定对话对象 ---

    const labelWorldPositions = {

      baruk:    new THREE.Vector3(npcPositions.baruk.x, 1.6, npcPositions.baruk.z),
      margaret: new THREE.Vector3(npcPositions.margaret.x, 1.6, npcPositions.margaret.z),
      rog:      new THREE.Vector3(npcPositions.rog.x, 1.6, npcPositions.rog.z),

    /** 找玩家附近最近的 NPC（第一/第三人称交互用） */
    /** 各 NPC 入场所需阶段已上移至模块顶部（避免 TDZ） */

    // 交互判定半径：E 键与提示条共用同一常量，避免"提示出现但 E 没反应"（原 E=2.0 / 提示=2.2 不一致）
    const INTERACT_RANGE = 2.4;

    function findNearbyNpc(range) {
      if (!fpsController || fpsController.mode === 'overview') return null;
      let nearest = null, nearestDist = range;
      Object.keys(npcPositions).forEach((key) => {
        if (key === 'guardian') return;
        // 只找已入场的 NPC（阶段足够才在场）
        if (currentPhase < (NPC_ENTRANCE_STAGE[key] || 99)) return;
        const entry = npcMeshes[key];
        if (!entry || !entry.group) return;
        const dx = entry.group.position.x - fpsController.pos.x;
        const dz = entry.group.position.z - fpsController.pos.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < nearestDist) { nearestDist = d; nearest = key; }
      });
      return nearest;
    }

    /** 高亮 NPC 标签（对话目标） */
    function highlightNpcLabel(npcKey) {
      document.querySelectorAll('.npc-label').forEach((l) => l.classList.remove('active-talk'));
      const nl = document.querySelector('.npc-label.' + npcKey);
      if (nl) nl.classList.add('active-talk');
