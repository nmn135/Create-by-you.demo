    /** E 键交互提示（每帧检查附近 NPC） */
    function updateInteractHint() {
      const hintEl = document.getElementById('interact-hint');
      if (!hintEl) return;
      if (fpsController.mode !== 'overview') {
        const near = findNearbyNpc(INTERACT_RANGE);
        if (near) {
          hintEl.textContent = '按 E 与 ' + npcPositions[near].displayName + ' 交谈';
          hintEl.classList.add('visible');
          return;
        }
      }
      hintEl.classList.remove('visible');
    }

    function updateLabels() {
      const halfW = window.innerWidth / 2;
      const halfH = window.innerHeight / 2;

      Object.entries(labelWorldPositions).forEach(([key, worldPos]) => {
        const el = labelEls[key];
        if (!el) return;

        const vec = worldPos.clone().project(camera);

        // 在屏幕后方则隐藏
        if (vec.z > 1) {
          el.style.opacity = '0';
          return;
        }

        const sx = (vec.x * halfW) + halfW;
        const sy = -(vec.y * halfH) + halfH;

        // 屏幕外则隐藏
        if (sx < -50 || sx > window.innerWidth + 50 || sy < -50 || sy > window.innerHeight + 50) {
          el.style.opacity = '0';
          return;
        }

        el.style.left = sx + 'px';
        el.style.top = sy + 'px';
        el.style.opacity = '1';
      });
    }

    // ============================================================
    // 11. 动画循环
    // ============================================================
    const clock = new THREE.Clock();

    // 道德评分演示值（后续接入游戏逻辑：-100 ~ +100）
    let moralityDemo = 0;
    let moralityDirection = 1;

    function moralColor(t) {
      // t: -100(红/暗) ~ 0(中性青) ~ +100(金/暖)
      if (t <= 0) {
        const f = (-t) / 100; // 0→1 越负越红
        const r = 0.36 + f * 0.5;
        const g = 0.78 - f * 0.5;
        const b = 0.85 - f * 0.5;
        return new THREE.Color(r, g, b);
      } else {
        const f = t / 100;
        const r = 0.36 + f * 0.55;
        const g = 0.78 + f * 0.1;
        const b = 0.85 - f * 0.4;
        return new THREE.Color(r, g, b);
      }
    }

    // ============================================================
    // 10.5 画质档位（高/中/低，动态生效不重建场景）
    // ============================================================
    //  高：阴影 2048+512 / pixelRatio≤2 / 粒子全开 / 火把 4 灯
    //  中：阴影 1024+256 / pixelRatio≤1.5 / 光环粒子关 / 火把 2 灯
    //  低：阴影全关 / pixelRatio=1 / 粒子全关 / 火把 1 灯
    // 由 Settings onApply 与自动降级调用；perf.setQuality 同步 HUD 标签。
    function applyQuality(level) {
      const L = level === 'medium' ? 'medium' : level === 'low' ? 'low' : 'high';

      // --- 阴影 ---
      if (L === 'low') {
        renderer.shadowMap.enabled = false;
        sunLight.castShadow = false;
        guardianPointLight.castShadow = false;
      } else {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        sunLight.castShadow = true;
        guardianPointLight.castShadow = true;
        const sunSize = L === 'high' ? 2048 : 1024;
        if (sunLight.shadow.mapSize.width !== sunSize) {
          sunLight.shadow.mapSize.set(sunSize, sunSize);
          sunLight.shadow.map && sunLight.shadow.map.dispose();
          sunLight.shadow.map = null; // 下一帧自动重建
        }
        const ptSize = L === 'high' ? 512 : 256;
        if (guardianPointLight.shadow.mapSize.width !== ptSize) {
          guardianPointLight.shadow.mapSize.set(ptSize, ptSize);
          guardianPointLight.shadow.map && guardianPointLight.shadow.map.dispose();
          guardianPointLight.shadow.map = null;
        }
      }

      // --- 像素比（antialias 无法动态关，靠此降载） ---
      const pr = L === 'high' ? Math.min(window.devicePixelRatio, 2)
        : L === 'medium' ? Math.min(window.devicePixelRatio, 1.5) : 1;
      renderer.setPixelRatio(pr);
      renderer.setSize(window.innerWidth, window.innerHeight);

      // --- 粒子（光环 42 + 光束 200） ---
      if (typeof guardianRing !== 'undefined') guardianRing.visible = (L === 'high');
      if (typeof beamParticles !== 'undefined') beamParticles.visible = (L !== 'low');

      // --- 火把点光源（4 → 2 → 1） ---
      if (typeof tavernProps !== 'undefined') {
        const keep = L === 'high' ? 4 : L === 'medium' ? 2 : 1;
        let torchIdx = 0;
        tavernProps.forEach((p) => {
          const l = p.userData && p.userData.light;
          if (!l) return;
          l.visible = torchIdx < keep;
          torchIdx++;
        });
      }

      if (typeof perf !== 'undefined') perf.setQuality(L);
    }

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const dt = Math.min(elapsed - (animate._prevElapsed || elapsed), 0.1);
      animate._prevElapsed = elapsed;

      // --- 性能监控采样 ---
      perf.tick(dt);

      // --- 统一火焰动画（火把 + 壁灯 + 烛火）：多频闪烁 + 余烬上升 + 画质门控 ---
      if (typeof __flames !== 'undefined' && __flames.length) {
        const q = (typeof window.__forceQuality !== 'undefined' && window.__forceQuality)
          ? window.__forceQuality : ((typeof perf !== 'undefined') ? perf._quality : 'high');
        const sconceVis = q === 'high' ? 4 : q === 'medium' ? 2 : 0;
        const torchKeep = q === 'high' ? 4 : q === 'medium' ? 2 : 1;
        let si = 0, ti = 0;
        for (let i = 0; i < __flames.length; i++) {
          const f = __flames[i];
          if (f.isSconce) {
            const vis = si < sconceVis;
            si++;
            f.flame.visible = f.core.visible = f.embers.visible = vis;
            if (f.glow) f.glow.visible = vis;
            if (f.light) f.light.visible = vis;
            if (!vis) continue;
          } else if (f.light) {
            f.light.visible = ti < torchKeep;
            ti++;
          }
          // 多频闪烁（基值 1 + 三档正弦叠加，各火焰相位不同）
          const fx = 1 + Math.sin(elapsed * 7 + i * 1.7) * 0.22 + Math.sin(elapsed * 13.3 + i * 0.9) * 0.09 + Math.sin(elapsed * 23 + i) * 0.05;
          f.flame.scale.setScalar(f.size * fx);
          if (f.core) f.core.scale.setScalar(f.size * 0.5 * (1 + Math.sin(elapsed * 9 + i * 2.3) * 0.18));
          if (f.glow) f.glow.material.opacity = f.glowBase + Math.sin(elapsed * 5 + i * 2.1) * 0.05;
          if (f.light) f.light.intensity = f.lightBase * (1 + Math.sin(elapsed * 9 + i * 3.1) * 0.22 + Math.sin(elapsed * 17 + i) * 0.08);
          if (f.embers) updateEmbers(f.embers, f.emberSeed, elapsed, i);
        }
      }

      // --- 空间音频：靠近光源火声渐强、角落闷响更沉 ---
      if (window.__ambientAudio && typeof fpsController !== 'undefined' && fpsController) {
        const px = fpsController.pos.x, pz = fpsController.pos.z;
        // 光源点：4 火把 + 4 壁灯 + 吊灯
        const LIGHTS = [[-8.5,-5],[8.5,-5],[-8.5,5],[8.5,5],[-5.2,-6.4],[5.2,-6.4],[-5.2,6.4],[5.2,6.4],[0,7.5]];
        let minD = 1e9;
        for (let i = 0; i < LIGHTS.length; i++) {
          const d = Math.hypot(px - LIGHTS[i][0], pz - LIGHTS[i][1]);
          if (d < minD) minD = d;
        }
        const fire = Math.max(0, 1 - minD / 8);   // 8m 内线性渐强
        // 平滑过渡（避免跳变）
        const curF = window.__ambientAudio._fireVol !== undefined ? window.__ambientAudio._fireVol : 0.012;
        const tgtF = 0.012 + fire * 0.025;
        window.__ambientAudio._fireVol = curF + (tgtF - curF) * 0.1;
        window.__ambientAudio.fireVolume = window.__ambientAudio._fireVol;
        const curD = window.__ambientAudio._droneVol !== undefined ? window.__ambientAudio._droneVol : 0.018;
        const tgtD = 0.018 + (1 - fire) * 0.008;
        window.__ambientAudio._droneVol = curD + (tgtD - curD) * 0.08;
        window.__ambientAudio.droneVolume = window.__ambientAudio._droneVol;
      }

      // --- 壁灯火焰闪烁已并入上方统一火焰系统（__flames） ---

      // --- 守护灵呼吸式缩放 ---
      const breathe = 1 + Math.sin(elapsed * 1.6) * 0.07;
      guardianCore.scale.setScalar(breathe);
      guardianGlow.scale.setScalar(breathe * 1.05);
      guardianMidGlow.scale.setScalar(breathe * 0.95);
      guardianGlow.material.opacity = 0.14 + Math.sin(elapsed * 1.6) * 0.05;
      guardianMidGlow.material.opacity = 0.07 + Math.sin(elapsed * 1.6 + 0.5) * 0.04;

      // --- 守护灵微浮动 ---
      guardianGroup.position.y = 3.2 + Math.sin(elapsed * 0.7) * 0.12;

      // --- 浮雕发光微呼吸 ---
      relief.material.emissiveIntensity = 0.45 + Math.sin(elapsed * 1.2) * 0.12;

      // --- 尘埃粒子（烛光漂浮） ---
      if (window.__atmosphere && window.__atmosphere.update) window.__atmosphere.update(dt);

      // --- 光束粒子动画 ---
      const posArr = beamParticlesGeo.attributes.position.array;
      const spds = beamParticlesGeo.userData.speeds;
      for (let i = 0; i < beamCount; i++) {
        posArr[i * 3 + 1] -= spds[i];
        if (posArr[i * 3 + 1] < 0) {
          posArr[i * 3 + 1] = 8;
          posArr[i * 3] = (Math.random() - 0.5) * 3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 3;
        }
      }
      beamParticlesGeo.attributes.position.needsUpdate = true;

      // --- 道德评分：优先使用 API 数据，否则使用演示循环 ---
      let effectiveScore;
      if (useApiScore) {
        effectiveScore = moralScore;
      } else {
        // 道德评分演示循环（红 → 青 → 金 → 青 → 红）
        moralityDemo += moralityDirection * dt * 18;
        if (Math.abs(moralityDemo) > 100) {
          moralityDemo = Math.sign(moralityDemo) * 100;
          moralityDirection *= -1;
        }
        effectiveScore = moralityDemo;
      }
      const mColor = moralColor(effectiveScore);
      guardianPointLight.color.copy(mColor);
      guardianCoreMat.color.copy(mColor);
      guardianCoreMat.emissive.copy(mColor).multiplyScalar(0.6);
      guardianGlow.material.color.copy(mColor).multiplyScalar(0.6);
      lightBulb.material.color.copy(mColor);

      // --- 新增：符文发光联动，道德评分影响符文 ---
      if (effectiveScore < -50) {
        westRunePanel.material.emissive.set(0x8b0000);
        westRunePanel.material.emissiveIntensity = 0.35;
      } else if (effectiveScore < -20) {
        westRunePanel.material.emissive.set(0xc8b478);
        westRunePanel.material.emissiveIntensity = Math.max(0.12, runeEmissiveIntensity * 0.35);
      } else {
        westRunePanel.material.emissive.set(0xc8b478);
        westRunePanel.material.emissiveIntensity = runeEmissiveIntensity;
      }

      // --- 新增：更新环境状态指示器 ---
      updateEnvIndicator(effectiveScore);

      // === 视觉增强：守护灵粒子光环旋转 & 随道德评分变色 ===
      const ring = guardianGroup.getObjectByName('guardianRing');
      if (ring) {
        // 道德评分越低旋转越快
        const ringSpeed = 0.5 + (-effectiveScore + 100) / 200 * 1.5;
        ring.rotation.y += ringSpeed * dt;

        // 光环颜色跟随守护灵
        ring.material.color.copy(mColor).multiplyScalar(0.7);

        // 粒子独立微浮动
        const rpArr = ring.geometry.attributes.position.array;
        const rBaseY = ring.userData.baseY;
        for (let i = 0; i < guardianRingCount; i++) {
          rpArr[i * 3 + 1] = rBaseY[i] + Math.sin(elapsed * 2.2 + i * 0.5) * 0.10;
        }
        ring.geometry.attributes.position.needsUpdate = true;
      }

      // === 视觉增强：浮雕 UV 缓慢滚动 ===
      reliefTex.offset.x += dt * 0.03;
      reliefTex.offset.y += dt * 0.015;

      // === 视觉增强：浮雕周围 4 族光点按序亮起 ===
      for (let i = 0; i < reliefDots.length; i++) {
        const dot = reliefDots[i];
        const ud = dot.userData;
        // 光点绕 Y 轴旋转
        const a = ud.angle + elapsed * 0.6;
        dot.position.x = Math.cos(a) * ud.radius;
        dot.position.z = Math.sin(a) * ud.radius;
        dot.position.y = ud.baseY + Math.sin(elapsed * 1.5 + ud.phase) * 0.04;
        // 循环亮灭：依次点亮
        const cycle = (elapsed * 0.7 + ud.phase) % (Math.PI * 2);
        const brightness = Math.max(0, Math.sin(cycle));
        dot.material.opacity = 0.25 + brightness * 0.7;
        dot.scale.setScalar(1 + brightness * 0.5);
      }

      // --- 入口封印环：缓慢旋转 + 脉动发光增强 ---
      sealRing.rotation.z += dt * 0.35;
      const sealPulseEnhanced = 0.25 + Math.sin(elapsed * 1.4) * 0.35 + Math.sin(elapsed * 0.55 + 1.2) * 0.2;
      sealRing.material.emissiveIntensity = Math.max(0.05, sealPulseEnhanced);

      // --- NPC 情绪位置平滑迁移（lerp）---
      const lerpSpeed = 3.5;
      Object.entries(npcMeshes).forEach(([key, { group }]) => {
        const target = npcEmotionTargets[key];
        if (!target) return;
        group.position.x += (target.targetX - group.position.x) * Math.min(lerpSpeed * dt, 1);
        group.position.z += (target.targetZ - group.position.z) * Math.min(lerpSpeed * dt, 1);
      });

      // === 视觉增强：NPC tense 情绪闪烁 ===
      Object.entries(npcMeshes).forEach(([key, { group }]) => {
        const ud = group.userData;
        if (ud.mood === 'tense') {
          ud.tenseTimer += dt;
          const flicker = 0.08 + Math.abs(Math.sin(elapsed * 5.5)) * 0.42;
          group.children.forEach((child) => {
            if (child.name === 'torso' && child.material.emissive) {
              child.material.emissiveIntensity = flicker;
            }
          });
        }
      });

      // === 视觉增强：情绪粒子衰减与运动 ===
      const epArr = scene.userData._emotionParticles;
      if (epArr && epArr.length > 0) {
        for (let i = epArr.length - 1; i >= 0; i--) {
          const p = epArr[i];
          p.userData.age += dt;
          const lifeRatio = 1 - p.userData.age / p.userData.life;
          if (lifeRatio <= 0) {
            // 粒子生命周期结束，清理
            scene.remove(p);
            p.geometry.dispose();
            p.material.dispose();
            epArr.splice(i, 1);
          } else {
            // 透明度衰减
            p.material.opacity = lifeRatio * 0.85;
            // 位置更新
            const pa = p.geometry.attributes.position.array;
            const vs = p.userData.velocities;
            for (let j = 0; j < p.userData.count; j++) {

              pa[j * 3 + 1] += vs[j].y * dt;
              pa[j * 3 + 2] += vs[j].z * dt;

        npcWanderState[k] = npcWanderState[k] || {};

        if (npcWanderState[k].entering) {

          const tgt = npcWanderState[k].target;
          const dx = tgt.x - e.group.position.x;

          const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist > 0.001) {
            const step = Math.min(dist, walkSpeed * dt);
            e.group.position.x += (dx / dist) * step;
            e.group.position.z += (dz / dist) * step;
            // 入场朝移动方向平滑转向（避免侧滑/横走入场）
            const _tY = Math.atan2(dx, dz);
            let _diff = _tY - e.group.rotation.y;
            while (_diff > Math.PI) _diff -= Math.PI * 2;
            while (_diff < -Math.PI) _diff += Math.PI * 2;

            // NPC 脚步声：每 ~0.6m 一声，随与玩家距离衰减
            npcWanderState[k].stepDist = (npcWanderState[k].stepDist || 0) + step;

          if (e.group.position.distanceTo(npcWanderState[k].target) < 0.3) {

        // 对话中（talk 动画播放）：暂停漫游，避免走动画打断说话

        if (_st && _st.current === 'talk') {

          npcWanderState[k].walking = false;
          npcWanderState[k].target = null;
          continue;
        }
        npcWanderState[k].timer = (npcWanderState[k].timer || 2) - dt;
        if (npcWanderState[k].timer <= 0) {
          npcWanderState[k].timer = 3 + Math.random() * 6;
          const bp = npcPositions[k];
          if (!npcWanderState[k].target) npcWanderState[k].target = new THREE.Vector3();
          npcWanderState[k].target.set(bp.x + (Math.random() - 0.5) * 1.2, bp.y, bp.z + (Math.random() - 0.5) * 1.2);

        if (npcWanderState[k].target) {

          if (npcWanderState[k].walking) {

            npcWanderState[k].stepDist = (npcWanderState[k].stepDist || 0) + _mv;
            if (npcWanderState[k].stepDist >= 0.6) {

    /** 显示可视线索提示条（最多 2 条，5 秒自动淡出，可点击 × 关闭） */
    function showHints(hints) {
      if (!hints) return;
      if (typeof hints === 'string') hints = [hints];
      if (!Array.isArray(hints) || hints.length === 0) return;
      hintsContainer.innerHTML = '';
      hints.slice(0, 2).forEach((hintText) => {
        const card = document.createElement('div');
        card.className = 'hint-card';
        card.innerHTML = '<span class="hint-icon">🗨️</span><span class="hint-text">' +
          escapeHtml(String(hintText)) +
          '</span><button class="hint-close" title="关闭">×</button>';
        const closeBtn = card.querySelector('.hint-close');
        closeBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          removeHintCard(card);
        });
        card._hintTimer = setTimeout(function() { removeHintCard(card); }, 12000);
        hintsContainer.appendChild(card);
      });
    }

    /** 移除一条提示卡（淡出后删除） */
    function removeHintCard(card) {
      if (!card || card._hintRemoved) return;
      card._hintRemoved = true;
      if (card._hintTimer) clearTimeout(card._hintTimer);
      card.classList.add('removing');
      setTimeout(function() {
        if (card.parentNode) card.parentNode.removeChild(card);
      }, 320);

        memoryListEl.innerHTML = '<div class="mem-empty">还没有确认的记忆</div>';

      "千年后，四族探险者找到了这座殿。殿门在他们踏入的瞬间封死，一个声音在所有人脑海中响起：「心中所念，即为钥匙。证明你们的灵魂值得。」",
      "你是第五个进入殿中的人——不属于任何与这座殿有宿怨的种族。千年来第一个无关之人。守护灵的目光，落在了你身上。",
      "冒险者将陆续到访。点「⏭ 等待…」请他们入场，点名字标签与他们对话。你的每一句话，都在改变他们的关系，与这座殿的结局。",
    ];
    // 开场流程：打字逐行 → 点任意处/Enter 推进 → 末行显示「进入大殿」
    const openingOverlay = document.getElementById('opening-overlay');
    const openingText = document.getElementById('opening-text');
    const openingCursor = document.getElementById('opening-cursor');
    const openingContinue = document.getElementById('opening-continue');
    const openingEnter = document.getElementById('opening-enter');
    let openingIdx = 0;
    let openingState = 0; // 0=打字中 1=本行完成待推进 2=全部完成
    let openingTimer = null;

    function typeOpeningLine(line) {
      let i = 0;
      openingText.textContent = '';
      openingContinue.style.opacity = '0';
      openingState = 0;
      openingTimer = setInterval(() => {
        i++;
        openingText.textContent = line.slice(0, i);
        if (i >= line.length) {
          clearInterval(openingTimer);
          openingState = 1;
          openingContinue.style.opacity = '1';
        }
      }, 22);
    }
    function openingNext() {
      if (openingIdx >= OPENING_LINES.length) {
        openingState = 2;
        openingContinue.style.opacity = '0';
        openingCursor.style.display = 'none';
        openingEnter.style.display = 'inline-block';
        return;
      }
      typeOpeningLine(OPENING_LINES[openingIdx]);
      openingIdx++;
    }
    function openingAdvance() {
      if (openingState === 0) {
        // 打字中点击 → 立即完成本行
        clearInterval(openingTimer);
        openingText.textContent = OPENING_LINES[openingIdx - 1];
        openingState = 1;
        openingContinue.style.opacity = '1';
      } else if (openingState === 1) {
        openingNext();
      }
    }
    openingOverlay.addEventListener('click', openingAdvance);
    document.addEventListener('keydown', (e) => {
      if (openingState === 2) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openingAdvance(); }
    });
    openingEnter.addEventListener('click', () => {
      openingOverlay.classList.add('done');
      const fc = window.__fpsController;
      if (fc && fc.mode === 'overview') fc.setMode('fps');
      document.getElementById('loading').classList.add('hidden');
      setTimeout(() => { openingOverlay.style.display = 'none'; }, 1300);
    });
    openingNext();
    document.getElementById('loading').classList.add('hidden');
    }, 600);

    // 场景氛围（暖光 + 墙面装饰 + 地面细节 + 尘埃粒子）——放在所有声明之后避免 TDZ
    window.__atmosphere = new Atmosphere({ THREE, scene, HALL, wallThick, wallHeight });

    // 场景道具加载器（Poly Haven 家具 FBX，替换部分程序化几何体）
    new Props({ THREE, FBXLoader, scene });

    // 设置面板（按键提示开关/灵敏度/改键/画质档位/性能监控）
    const settings = new Settings({
      onApply: (s) => {
        // 按键提示显隐
        const hintEl = document.getElementById('hint');
        if (hintEl) hintEl.style.opacity = s.showHints ? '' : '0';
        // 灵敏度传给 FPS 控制器
        if (fpsController) fpsController.sensitivity = s.sensitivity;
        // 改键：切换键 / 奔跑键
        if (fpsController) {
          fpsController.toggleKey = s.toggleKey;
          fpsController.runKey = s.runKey;
        }
        // 画质档位
        if (s.quality) applyQuality(s.quality);
        // 性能监控 HUD 开关
        perf.setVisible(s.showPerf !== false);
        // 背景音乐音量
        if (window.__ambientAudio && s.musicVol !== undefined) window.__ambientAudio.musicVolume = s.musicVol;
      },
    });
    // 初始应用
    settings.onApply({ showHints: settings.get('showHints'), sensitivity: settings.get('sensitivity'), toggleKey: settings.get('toggleKey'), runKey: settings.get('runKey'), quality: settings.get('quality'), showPerf: settings.get('showPerf'), musicVol: settings.get('musicVol') });

    // 引导系统：同步当前阶段目标（开场结束进入 FPS 后展示对应阶段目标）
    guidance.setStage(currentPhase);

    // UI 面板可拖动（位置持久化；右下角「调整布局 / 固定 / 重置」）
    initDraggableUI({
      chat: '#chat-history',
      rel: '#relationship-panel',
      mem: '#memory-panel',
      goal: '#g-goal-panel',
      inputArea: '#chat-input-area',
      hintBar: '#hint',
      advanceBtn: '#phase-advance-btn',
    });

    // 开始渲染循环
    animate();

    // 默认进入第一人称视角（开场卡关闭后即为沉浸视角）
    // (自动切入第一人称已移至开场结束后触发)

    console.log('🏛️  封印之殿 — Sealed Hall — 3D 场景已就绪');
    console.log('  拖拽旋转 | 滚轮缩放 | 右键平移');
    console.log('  快捷键: R=重置视角 F=聚焦守护灵 G=俯视全局');
    console.log('  NPC情绪: 1=Liana怒 2=Baruk怒 3=Rog接近 4=Margaret忏悔');
    console.log('  符文: Q=变暗 E=变亮 | 色温: W=暖 S=冷 | 对话: T=切换 空格=下一条');
    console.log('  对话系统: Enter发送 Shift+Enter换行 /n=推进阶段 | API: ' + API_BASE);
    console.log('  第一人称: C 键切换俯瞰/第一人称，WASD 移动，Shift 奔跑，点击锁定鼠标');

    // 调试钩子：暴露模型管理器供自动化测试/诊断（只读）
    window.__getModelManager = () => modelManager;
    window.__getModelStates = () => {
      const out = {};
      for (const k in modelManager.models) {
        const st = modelManager.models[k];
        const act = st.current ? st.mixer.clipAction(st.clips[st.current]) : null;
        out[k] = {
          current: st.current,
          clips: Object.keys(st.clips),
          time: act ? Number(act.time.toFixed(2)) : null,
          duration: st.clips[st.current] ? Number(st.clips[st.current].duration.toFixed(2)) : null,
        };
      }
      return out;
    };
  </script>
</body>
</html>
